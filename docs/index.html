{"id":173,"topic":12,"prompt":"UART 設為 9600 baud、7E2。假設每 symbol 一 bit，連續傳送時理想平均每秒可送出多少資料字元？","options":["約 1371.4 字元/s","約 1200 字元/s","約 960 字元/s","約 872.7 字元/s"],"correct":3,"explanation":"7E2 有 7 data、1 even parity、2 stop，再加 1 start，共 11 bit time。9600 除以 11 約 872.7 個 frame 每秒，這裡算的是理想平均率。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 20"},
{"id":174,"topic":12,"prompt":"保持參考電壓 3.3 V，理想 ADC 從 8-bit 換成 10-bit，量化步階變成原先幾倍？","options":["1/4","4 倍","1/2","2 倍"],"correct":0,"explanation":"量化階數由 256 增為 1024，是四倍。理想 LSB 等於 VREF 除以階數，所以每階變成原先四分之一。雜訊與實際量測準確度仍需另看。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 23–25"},
{"id":175,"topic":12,"prompt":"使用講義的單端 ADC 命令。channel=3 時，第二個送出的 byte 為何？","options":["0x30","0xB0","0x83","0x38"],"correct":1,"explanation":"8+3 等於 11，即十六進位 B。向左移 4 位得到 0xB0。最高位表示單端，後三位指定通道，再置於此 byte 的高半部。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 28–29","code":"tx = [1, (8 + channel) &lt;&lt; 4, 0]"},
{"id":176,"topic":12,"prompt":"這段解碼得到的十進位結果是多少？","options":["768","800","256","1023"],"correct":0,"explanation":"0xF3 與 3 做 AND 後只剩 3。左移 8 位是 3×256=768，第三個 byte 為 0，所以最後是 768。第一個接收 byte 不參與此解碼。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 28–29","code":"rx = [0x80, 0xF3, 0x00]\nadc = ((rx[1] &amp; 3) &lt;&lt; 8) | rx[2]"},
{"id":177,"topic":12,"prompt":"講義 read_adc 呼叫 read_adc(8) 時，按下列程式會發生什麼？","options":["將通道 8 轉為通道 0 後傳輸","送出 0x100，等 SPI 函式庫決定結果","拋出 ValueError，尚未執行 SPI 傳輸","送出 0x80 並回傳 8"],"correct":2,"explanation":"MCP3008 的通道索引是 0 至 7。函式在 xfer2 前先檢查範圍，8 不符合條件，會在組出或傳送封包之前停止。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 29","code":"def read_adc(channel):\n    if not 0 &lt;= channel &lt;= 7:\n        raise ValueError(&quot;channel must be 0..7&quot;)\n    return spi.xfer2([1, (8 + channel) &lt;&lt; 4, 0])"},
{"id":178,"topic":12,"prompt":"一個感測器在輸入階躍後要 800 ms 才接近新穩態。800 ms 描述的是哪個特性？","options":["ADC 量化步階","響應時間","靈敏度","線性度"],"correct":1,"explanation":"響應時間描述輸入改變後，輸出跟上的時間。靈敏度關心輸入變一單位時輸出變多少，線性度關心輸入與輸出關係是否接近直線。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 33"},
{"id":179,"topic":12,"prompt":"依講義的固定接法，上方 10 kΩ、下方 LDR，VCC=VREF=3.3 V。若 LDR=5 kΩ，VOUT 和 ADC 碼約為何？","options":["2.20 V，683","0.55 V，171","1.65 V，512","1.10 V，341"],"correct":3,"explanation":"VOUT 是下方電阻的壓降。3.3×5/(10+5)=1.10 V，10-bit 理想換算為 1024×1.10/3.3≈341。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 37–39"},
{"id":180,"topic":12,"prompt":"初始 light_on=True，ADC 依序是 451、450、599、600。按講義雙門檻程式，四筆處理後的狀態依序為何？","options":["開、開、關、開","開、關、關、開","關、關、開、開","開、關、開、開"],"correct":1,"explanation":"451 在中間區間，維持開。450 觸發關。599 再次在中間區間，維持關。600 觸發開。判斷需保留前一狀態，並注意等號。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 40","code":"if adc &gt;= 600:\n    light_on = True\nelif adc &lt;= 450:\n    light_on = False"},
{"id":181,"topic":12,"prompt":"依講義接法實測，亮處為 160–210，暗處為 650–760。若採暗處開燈的雙門檻，哪一組最合理？","options":["ADC ≥200 開，ADC ≤190 關","ADC ≥600 開，ADC ≤300 關","ADC ≥800 開，ADC ≤780 關","ADC ≤300 開，ADC ≥600 關"],"correct":1,"explanation":"亮處上界 210 與暗處下界 650 之間有可用區間。300 和 600 都在區間內，且較高的 ADC 值對應較暗。兩門檻間保留狀態可避免來回切換。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 37–40"},
{"id":182,"topic":12,"prompt":"GStreamer 指令中每個 ! 的作用是什麼？","options":["把右側元件名稱送到 CSI 的 I²C 暫存器","標記接下來的元件都要單獨執行","把前一個元件輸出接到下一個元件輸入","要求終止並清除前一個影格"],"correct":2,"explanation":"GStreamer 用 ! 表示管線元件之間的連接。此例依序擷取 CSI 影像、轉換格式，再送到顯示輸出。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 43、46–47","code":"gst-launch-1.0 nvarguscamerasrc ! nvvidconv ! xvimagesink"},
{"id":183,"topic":12,"prompt":"在講義的 CSI 管線中，插入 video/x-raw(memory:NVMM) 等 caps 的用途是什麼？","options":["用它取代相機來源和所有 sink","在 cap 字串裡實作 RGB 色彩轉換演算法","直接建立 OpenCV 的影像陣列","限制或協商元件之間的影像格式、尺寸或記憶體型態"],"correct":3,"explanation":"caps 描述這段管線可接受的資料特性。實際擷取、轉換與輸出仍由 source、transform、sink 等元件完成。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 46–48"},
{"id":184,"topic":13,"prompt":"Linux 驅動程式向應用程式呈現的裝置介面，哪組配對合理？","options":["字元裝置每次系統呼叫只能傳 1 byte，磁碟也一樣","字元裝置可提供 byte stream，磁碟是 block device，網卡處理封包","磁碟靠 socket byte stream，網卡靠字符版的 printf","網路介面一定有實體網卡，loopback 屬於 block device"],"correct":1,"explanation":"字元裝置可經節點存取資料流，block device 用區塊處理儲存 I/O，網路裝置參與封包傳輸。loopback 是軟體網路介面。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 6、9–11"},
{"id":185,"topic":13,"prompt":"要實作排程、記憶體管理與裝置操作，哪一項符合講義的 kernel 分工？","options":["核心管理系統資源，應用程式以系統呼叫請求服務","應用程式每次 read 都會把驅動搬到 user space","驅動模組是在瀏覽器執行的使用者腳本","應用程式直接管理所有程序的頁表，核心只顯示終端文字"],"correct":0,"explanation":"核心包含排程、記憶體、VFS 和驅動等子系統。一般應用透過系統呼叫進入核心介面，再由核心選擇具體處理方式。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 7–8、22、31"},
{"id":186,"topic":13,"prompt":"在簡易 hellod 範例裡，這兩行將哪個函式安排在 insmod 時執行？","options":["兩個都執行，順序由 lsmod 決定","hello_exit","兩個都不執行，必須先建立 /dev/demo","hello_init"],"correct":3,"explanation":"module_init 宣告載入時的初始化入口，module_exit 宣告正常卸載時的清理入口。純示範模組即使沒有 /dev 節點，也可以執行 init。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 16–20","code":"module_init(hello_init);\nmodule_exit(hello_exit);"},
{"id":187,"topic":13,"prompt":"驅動初始化時，register_chrdev 回傳負值，接著此 init callback 回傳 -EBUSY。載入會如何？","options":["等使用者第一次 open 才決定載入是否成功","載入失敗，核心把 init 的失敗回報給 insmod","成功載入並註冊裝置，因為負值代表自動分配 major","自動改執行 module_exit 後宣告載入成功"],"correct":1,"explanation":"init 回傳 0 表示成功。負的 errno 代表初始化失敗。此處驅動用 -EBUSY 回報，應查核心日誌與裝置號是否被占用。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 17、43","code":"if (register_chrdev(60, &quot;demo&quot;, &amp;drv_fops) &lt; 0)\n    return -EBUSY;\nreturn 0;"},
{"id":188,"topic":13,"prompt":"要在當前 Linux 上確認 hellod 已載入並查看 printk 訊息，哪組命令最直接？","options":["只用 ls 查 .ko 存在，再用 cat 讀 .ko","lsmod 查模組，再用 dmesg 讀核心日誌","用 chmod 更改檔案權限，然後執行 ./hellod.ko","用 file 查 .ko，再用 printf 讀核心日誌"],"correct":1,"explanation":"lsmod 查目前執行核心中的模組，dmesg 查看核心 log。file 或 ls 只能描述磁碟上的產物，無法確認已載入。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 19–20、28–30"},
{"id":189,"topic":13,"prompt":"核心建置目錄和模組目錄不同。改寫成下列常見 Kbuild 命令時，M 的值應指向哪裡？","options":["執行中核心的 /boot 目錄","/dev 下的字元裝置檔案","/sys/class/gpio 介面","存放本次外部模組 Makefile 與原始碼的目錄"],"correct":3,"explanation":"-C 切到對應 kernel build tree。M 指明外部模組所在目錄，讓 Kbuild 讀取該處的 obj-m 等規則。講義也示範了較舊的 SUBDIRS 寫法。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 14–15、26–28、36","code":"make -C &quot;$kernel_dir&quot; M=&quot;$PWD&quot; modules"},
{"id":190,"topic":13,"prompt":"以下 mknod 已成功，但這時核心裡還沒有人註冊對應的字元裝置號。開啟 /dev/demo 的結果為何？","options":["核心靠 demo 這個檔名選擇任何已載入模組","節點存在就保證 read 與 write 都成功","mknod 自動將 demo.ko 編譯並載入","節點存在，但缺對應 driver 時無法成功開啟裝置"],"correct":3,"explanation":"mknod 建立的是帶型別及設備號的節點。open 需要核心找到對應的註冊與 callbacks，單有節點不足以提供 I/O。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 34–35、42–43","code":"mknod /dev/demo c 60 0"},
{"id":191,"topic":13,"prompt":"若把模組的 MAJOR_NUM 改成 61，並已用該號碼註冊，新節點應使用哪條命令？假設 minor 仍為 0。","options":["mknod /dev/demo c 61 0","mknod /dev/demo c 0 61","mknod /dev/demo b 61 0","mknod /dev/demo c 60 1"],"correct":0,"explanation":"c 是字元裝置，後兩個數字依序為 major 與 minor。節點要匹配驅動註冊的 major 61，且保留題目指定的 minor 0。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 42–44、58"},
{"id":192,"topic":13,"prompt":"下列註冊內容中，使用者對 /dev/demo 執行 write 時，應由哪個函式處理？","options":["drv_open","drv_read","drv_release","drv_write"],"correct":3,"explanation":"核心依檔案操作類型查 file_operations。write 系統呼叫走 .write 指定的 drv_write，開啟或最後釋放檔案則走各自的 callback。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 37–42","code":"static const struct file_operations fops = {\n    .open = drv_open,\n    .read = drv_read,\n    .write = drv_write,\n    .release = drv_release,\n};"},
{"id":193,"topic":13,"prompt":"若驅動提供 .unlocked_ioctl，想發送指定的裝置控制命令，使用者程式應採哪種方式？","options":["呼叫 ioctl(fd, command, arg)，由該 callback 處理命令","呼叫 read(fd, command, arg) 並期待走 .unlocked_ioctl","執行 mknod，最後一個參數即為 ioctl command","向 /dev 寫入 command，讓核心卸載模組"],"correct":0,"explanation":"ioctl 對已開啟的 fd 送出裝置專用命令。驅動可依 command 選擇行為，例如講義的 switch 分支。是否支援取決於裝置已註冊的 API。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 39、42、49"},
{"id":194,"topic":13,"prompt":"講義的 iCount 初始為 0。假設沒有卸載模組、沒有並行呼叫，連續進入 drv_write 三次，核心 log 印出的數字依序為何？","options":["0、1、2","1、2、3","0、0、0","3、2、1"],"correct":0,"explanation":"iCount 是模組內的 static 變數，會跨呼叫保留。每次先印目前的值，再自增，因此三次依序印出 0、1、2，最後變數值為 3。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 41、47、55","code":"static int iCount = 0;\n/* 在每次 drv_write 內 */\nprintk(&quot;%d\\\\n&quot;, iCount);\niCount++;"},
{"id":195,"topic":13,"prompt":"講義的簡化 drv_read 只印訊息並 return count，沒有填使用者的 buf。若要它成為真正的資料讀取，哪個修改才合理？","options":["把實際資料安全地複製到使用者 buffer，再回傳交付的 byte 數","維持只印 printk，使用者就能從 buf 取得該訊息","改成 return -count 表示讀取成功","將 count 當字串指標直接填進 buf"],"correct":0,"explanation":"read 回傳正值表示已交付多少 bytes，單純回傳 count 並不會改變 user buffer。驅動需以適當的 uaccess 操作複製資料，再依實際結果回報。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 46","code":"printk(&quot;device read\\\\n&quot;);\nreturn count;"},
{"id":196,"topic":13,"prompt":"驅動內核 buffer 容量 100 bytes，使用者要求 write 120 bytes。以下哪個做法合理？","options":["先把 user 指標轉成 char*，就可直接寫入 120 bytes","直接複製 120 bytes，最後把 return 值改成 100","將 count 改成 -120 後交給 memcpy","先限制長度或拒絕，再用適當 uaccess API 複製資料"],"correct":3,"explanation":"必須在複製前避免超出目標 buffer，並檢查複製是否成功。user 指標不能當成普通核心位址直接使用，回傳值也無法修正已發生的越界。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 47–48"},
{"id":197,"topic":13,"prompt":"以下是延伸自講義的 uaccess 寫入片段。copy_from_user 回傳非零時，這段會回傳什麼？","options":["-EFAULT","0，表示核心已存好資料","-EBUSY，表示裝置號被占用","n，表示完整成功"],"correct":0,"explanation":"copy_from_user 回傳未複製的 byte 數，0 表示完整複製。此例將任何未完成複製視為錯誤，立即回傳 -EFAULT。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 48","code":"if (copy_from_user(kernel_buf, user_buf, n) != 0)\n    return -EFAULT;\nreturn n;"},
{"id":198,"topic":13,"prompt":"講義使用下列 fwrite 呼叫。假設 I/O 成功，要求寫入的總長度與 fwrite 的回傳值各是多少？","options":["字串的可見長度，回傳該長度","1024 bytes，回傳 1024","1024 bytes，回傳 1","1 byte，回傳 1024"],"correct":2,"explanation":"fwrite 的第二個參數是每個元素大小，第三個是元素數。此處請求一個 1024-byte 元素，成功回傳元素數 1。字串內的 NUL 不會讓 fwrite 自動縮短長度。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 52–53","code":"char buf[1024] = &quot;Data Input&quot;;\nsize_t written = fwrite(buf, sizeof buf, 1, fp);"},
{"id":199,"topic":13,"prompt":"init 已成功註冊字元裝置，模組卸載時要做哪件事，才能撤銷該註冊？","options":["將 .ko 改名成 .o 後留在磁碟","再次呼叫 register_chrdev，增加引用計數","以對應 major 和名稱呼叫 unregister_chrdev","只執行 close 目前終端機的 stdout"],"correct":2,"explanation":"module exit 應撤銷初始化取得的核心資源，這裡包括用 unregister_chrdev 解除已註冊的設備號與名稱。單純改產物檔名不會清理執行中的核心狀態。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 40、43–45","code":"unregister_chrdev(MAJOR_NUM, MODULE_NAME);"},
{"id":200,"topic":13,"prompt":"講義同時提到模組使用引用數和示範變數 iCount。哪項說法正確？","options":["iCount 只要大於 0，rmmod 就一定拒絕卸載","每次 printk 都會增加模組引用數","引用數影響安全卸載，iCount 用來觀察 drv_write 執行次數","模組引用數與 iCount 會在每次 write 後一律同時歸零"],"correct":2,"explanation":"核心的模組引用用來追蹤是否還被使用。iCount 只是範例程式自行維護的變數。一次 write 完成後，iCount 會保留，但這不代表模組仍存在一筆引用。","source":"Lecture6_Embedded_Linux-Device-Driver.pdf · PDF 頁序 23–24、47"}

  const navigation = document.getElementById('navigation');
  const storageNote = document.getElementById('storage-note');
  const restartDialog = document.getElementById('restart-dialog');
  let pendingRound = null;

  function save() {
    try { localStorage.setItem(storageKey, JSON.stringify(state)); }
    catch { storageOK = false; }
  }

  function dayKey(date) {
    return [date.getFullYear(),date.getMonth()+1,date.getDate()].join('-');
  }

  function streakDays() {
    const date = new Date();
    if (!state.days[dayKey(date)]) date.setDate(date.getDate()-1);
    let count = 0;
    while (state.days[dayKey(date)]) {
      count++;
      date.setDate(date.getDate()-1);
    }
    return count;
  }

  function updateTheme() {
    const theme = state.settings.theme;
    document.documentElement.dataset.theme = theme === 'light' || (theme === 'system' && !systemTheme.matches) ? 'light' : 'dark';
  }

  function shuffle(items) {
    const result = [...items];
    for (let index = result.length-1; index > 0; index--) {
      const swap = Math.floor(Math.random() * (index+1));
      [result[index],result[swap]] = [result[swap],result[index]];
    }
    return result;
  }

  function candidates(mode, topic, fresh) {
    const pool = mode === 'mistakes' ? mistakes() : questions;
    return pool.filter(question => {
      const matchesTopic = topic === 'lecture'
        ? topics[question.topic - 1].group === 'lecture'
        : topic === 'all' || question.topic === Number(topic);
      return matchesTopic && (!fresh || !state.records[question.id]);
    });
  }

  const caption = (eyebrow,title,description) => '<header class="intro"><p class="eyebrow">'+eyebrow+'</p><h1 tabindex="-1">'+title+'</h1><p class="muted">'+description+'</p></header>';
  const button = (action, content, value='', attributes='') =>
    '<button type="button" data-action="'+action+'" data-value="'+value+'" '+attributes+'>'+content+'</button>';
  const chip = (action, text, value, selected, cls='chip') =>
    button(action,text,value,'class="'+cls+'" aria-pressed="'+selected+'"');
  const progress = (value,max,label) => '<progress class="progress" value="'+value+'" max="'+max+'" aria-label="'+label+'"></progress>';
  const answered = round => Object.keys(round.answers).length;
  const roundScore = round => round.items.reduce((total,item) => total + Number(round.answers[item.id] === byId.get(item.id).correct),0);
  const roundReady = round => answered(round) === round.items.length;
  const activeRound = () => state.round && !state.round.done;

  function topicChips(action,selected) {
    return chip(action,'全部章節（混合）','all',selected==='all') +
      chip(action,'Lecture 專題','lecture',selected==='lecture') +
      topics.map((topic,index)=>chip(action,topic.label,String(index+1),selected===String(index+1))).join('');
  }

  function home() {
    const { mode,topic,size,fresh } = state.setup;
    const matching = candidates(mode,topic,fresh).length;
    const count = Math.min(matching,size === 'all' ? matching : Number(size));
    const wrongCount = mistakes().length;
    const resume = activeRound()
      ? '<div class="panel resume row wrap-row"><div><h2>上次練習</h2><p class="small muted">已作答 '+answered(state.round)+' / '+state.round.items.length+' 題</p></div>'+button('resume','繼續練習','','class="inline"')+'</div>'
      : '';
    const tiles = Object.entries(modes).map(([key,[symbol,label,description]])=>button('mode',
      '<span class="tile-icon">'+icon(symbol)+'</span><strong>'+label+'</strong><span class="muted small">'+description+'</span>',key,
      'class="mode" aria-pressed="'+(key===mode)+'"')).join('');
    const sizes = ['all','10','20','30'].map(value=>chip('size',value==='all'?'全部':value+' 題',value,value===size,'count')).join('');
    const scope = scopeLabel(topic);
    const empty = !count && mode==='mistakes' ? '這個範圍目前沒有待複習的錯題。' : !count ? '這個範圍目前沒有符合條件的題目。' : '';
    return caption('MICROPROCESSOR REVIEW','微處理機模擬題','全題庫 '+questions.length+' 題 · Lecture 1–6 專題新增 100 題')+resume+
      '<section class="panel"><div class="row"><h2>開始新一輪</h2><span class="muted small" role="status">符合條件 '+matching+' 題</span></div>'+
      '<div class="mode-grid" role="group" aria-label="練習模式">'+tiles+'</div>'+
      '<div class="setup-field"><div class="row"><h3>章節範圍</h3><span class="muted small">'+scope+'</span></div><div class="chips" role="group" aria-label="章節範圍">'+topicChips('topic',topic)+'</div></div>'+
      '<div class="setup-field"><div class="row wrap-row"><h3>本輪題數</h3><label class="checkline"><input id="fresh" type="checkbox" '+(fresh?'checked ':'')+(mode==='mistakes'?'disabled':'')+'>只練未作答的題目</label></div><div class="chips" role="group" aria-label="本輪題數">'+sizes+'</div></div>'+
      button('start',icon('play')+' 開始練習 · '+count+' 題','','class="primary inline start" '+(count?'':'disabled'))+
      (empty?'<p class="small muted" style="margin-top:9px">'+empty+'</p>':'')+'</section>'+
      '<div class="shortcuts">'+
      button('nav','<span class="tile-icon">'+icon('repeat')+'</span><span class="grow"><strong>錯題本</strong><br><span class="small muted">'+(wrongCount?'待複習 '+wrongCount+' 題':'目前沒有錯題')+'</span></span>'+icon('right'),'mistakes','class="shortcut"')+
      button('nav','<span class="tile-icon">'+icon('chart')+'</span><span class="grow"><strong>學習統計</strong><br><span class="small muted">已作答 '+countAnswered()+' 題 · 連續 '+streakDays()+' 天</span></span>'+icon('right'),'stats','class="shortcut"')+'</div>';
  }

  function solution(question, letter, result) {
    const lead = result === undefined ? '答案 '+letter : result ? '答對了 · '+letter : '答錯了 · 正確選項 '+letter;
    return '<div class="solution"><p><strong '+(result===false?'class="wrong-text"':'')+'>'+lead+'</strong> '+question.options[question.correct]+'</p><p>'+question.explanation+'</p><p class="small muted">'+question.source+'</p></div>';
  }

  function codeSnippet(question) {
    return question.code ? '<pre class="question-code" tabindex="0" aria-label="題目程式碼"><code>'+question.code+'</code></pre>' : '';
  }

  function practice() {
    const round = state.round;
    const item = round.items[round.index];
    const question = byId.get(item.id);
    const pick = round.picks[item.id];
    const checked = Object.hasOwn(round.answers,item.id);
    const right = round.answers[item.id] === question.correct;
    const displayedCorrect = letters[item.order.indexOf(question.correct)];
    const optionList = item.order.map((option,index) => {
      const correct = checked && option===question.correct;
      const wrong = checked && option===round.answers[item.id] && !right;
      const cls = correct ? ' correct' : wrong ? ' wrong' : '';
      const marker = correct ? '<span class="marker" aria-label="正確選項">✓</span>' : wrong ? '<span class="marker" aria-label="你的選項答錯">✕</span>' : '<span class="marker" aria-hidden="true"></span>';
      return '<label class="option'+cls+'"><input type="radio" name="choice" value="'+option+'" '+(pick===option?'checked ':'')+(checked?'disabled':'')+'><span class="letter">'+letters[index]+'</span><span>'+question.options[option]+'</span>'+marker+'</label>';
    }).join('');
    const jumpList = round.items.map((entry,index)=>{
      const record = round.answers[entry.id];
      const answered = Object.hasOwn(round.answers,entry.id);
      const cls = answered ? record===byId.get(entry.id).correct?' correct':' wrong' : '';
      return button('jump',String(index+1),index,'class="q-jump'+cls+'" '+(index===round.index?'aria-current="step" ':'')+
        'aria-label="第 '+(index+1)+' 題'+(answered?(cls===' correct'?'，答對':'，答錯'):'，未作答')+'"');
    }).join('');
    const label = checked ? roundReady(round) && round.index===round.items.length-1 ? '查看本輪結果' : '下一題' : '確認答案';
    return '<div class="practice"><div class="practice-head row">'+button('nav',icon('back')+' 返回','','class="inline"')+
      '<div class="inline"><span style="text-align:right"><strong>'+modes[round.mode][1]+'</strong><br><span class="muted">第 '+(round.index+1)+' / '+round.items.length+' 題</span></span>'+
      button('toggle-jump',icon('list')+' 題目導覽','','class="inline" aria-controls="jump-panel" aria-expanded="'+jumpOpen+'"')+'</div></div>'+
      progress(answered(round),round.items.length,'本輪已作答')+
      (jumpOpen?'<div class="panel jump-panel" id="jump-panel"><h2>本輪題目</h2><div class="jump-grid">'+jumpList+'</div></div>':'')+
      '<section class="panel practice-card" aria-label="練習題"><div class="badges"><span class="badge">'+topicTitle(question.topic)+'</span><span class="badge">單選題</span><span class="badge accent">題庫第 '+question.id+' 題</span></div>'+
      '<fieldset><legend tabindex="-1">'+question.prompt+'</legend>'+codeSnippet(question)+optionList+'</fieldset>'+
      (checked?solution(question,displayedCorrect,right):'')+'</section>'+
      '<div class="practice-actions">'+button('previous',icon('left'),'','aria-label="上一題" '+(round.index===0?'disabled':''))+
      button(checked?'next':'submit',label+(checked?' '+icon('right'):''),'','id="practice-primary" class="primary inline" '+(!checked&&pick===undefined?'disabled':''))+'</div></div>';
  }

  function mistakesView() {
    const items = mistakes();
    return caption('REVIEW','錯題本','每次答錯都會收進錯題本，連續答對兩次後移出。')+
      '<div class="panel">'+(items.length?
      '<div class="row wrap-row"><h2>待複習 '+items.length+' 題</h2>'+button('practice-mistakes',icon('play')+' 開始錯題練習','','class="primary inline"')+'</div>'+
      items.map(question=>'<details class="list-row"><summary>'+question.id+' · '+question.prompt+'</summary><p class="small muted">'+topicTitle(question.topic)+' · 連續答對 '+state.records[question.id].streak+' / 2 次</p>'+codeSnippet(question)+solution(question,letters[question.correct])+button('practice-one','練這一題',question.id)+'</details>').join('')
      :'<div class="empty"><h2>目前沒有錯題</h2><p class="muted">答錯的題目會自動列在這裡。</p>'+button('nav','回首頁練習','home','class="inline"')+'</div>')+'</div>';
  }

  function totals(records) {
    return records.reduce((total,record) => ({ attempts:total.attempts+record.attempts, correct:total.correct+record.correct }),{attempts:0,correct:0});
  }

  const rate = score => score.attempts ? Math.round(score.correct/score.attempts*100)+'%' : '—';
  const metric = (value,label,note) => '<div class="metric"><strong>'+value+'</strong><h3>'+label+'</h3><p class="muted small">'+note+'</p></div>';

  function stats() {
    const score = totals(Object.values(state.records));
    return caption('PROGRESS','學習統計','正確率以歷次作答計算，章節進度以做過的不同題目計算。')+
      '<div class="metrics">'+metric(rate(score),'總正確率',score.attempts?'答對 '+score.correct+' / '+score.attempts+' 次':'尚未作答')+
      metric(countAnswered(),'已作答題數','題庫共 '+questions.length+' 題')+metric(mistakes().length,'錯題本','待複習題數')+metric(streakDays(),'連續練習','天')+'</div>'+
      '<section class="panel"><h2>章節表現</h2>'+
      topics.map((topic,index)=>{
        const subset = questions.filter(question=>question.topic===index+1);
        const records = subset.map(question=>state.records[question.id]).filter(Boolean);
        const score = totals(records);
        return '<div class="stat-row"><div class="row"><h3>'+topic.label+'</h3><span class="muted small">'+(score.attempts?'正確率 '+rate(score):'未作答')+' · '+records.length+' / '+subset.length+' 題</span></div>'+
          progress(records.length,subset.length,topic.label+' 作答進度')+'</div>';
      }).join('')+'</section>';
  }

  function settings() {
    return caption('SETTINGS','設定','調整外觀與練習行為。')+
      '<div class="section-stack">'+
      '<section class="panel setting"><h2>外觀</h2><p class="muted">選擇題庫配色。</p><div class="chips" role="group" aria-label="外觀">'+
      [['system','跟隨系統'],['light','淺色'],['dark','深色']].map(([key,label])=>chip('theme',label,key,state.settings.theme===key)).join('')+'</div></section>'+
      '<section class="panel setting row wrap-row"><div><h2>答對後自動下一題</h2><p class="muted">答對後停留 1 秒。關閉時可自行讀完詳解再繼續。</p></div><label class="checkline"><input id="auto-next" type="checkbox" '+(state.settings.autoNext?'checked':'')+'>啟用</label></section>'+
      '<section class="panel setting row wrap-row"><div><h2>重設所有進度</h2><p class="muted">清除作答紀錄、錯題本與續練進度。</p></div>'+button('reset','重設進度','','class="danger"')+'</section>'+
      '<section class="panel"><h2>關於題庫</h2><p class="muted">微處理機模擬題 · '+questions.length+' 題 · Lab 1–6 與 Lecture 1–6</p>'+button('nav','瀏覽完整題庫','library','class="text-button"')+'</section></div>';
  }

  function library() {
    const list = candidates('ordered',libraryTopic,false);
    return caption('QUESTION BANK','完整題庫','展開任一題可查看選項、答案與詳解。')+
      '<section class="panel"><div class="chips" role="group" aria-label="題庫章節">'+topicChips('library-topic',libraryTopic)+'</div>'+
      list.map(question=>'<details class="list-row"><summary>'+question.id+' · '+question.prompt+'</summary>'+codeSnippet(question)+'<ol type="A" class="library-options">'+
        question.options.map(option=>'<li>'+option+'</li>').join('')+'</ol>'+solution(question,letters[question.correct])+'</details>').join('')+'</section>';
  }

  function result() {
    const round = state.round;
    const wrong = round.items.filter(item => round.answers[item.id] !== byId.get(item.id).correct);
    const count = round.items.length;
    return caption('RESULT','本輪練習完成',modes[round.mode][1]+' · '+count+' 題')+
      '<div class="metrics">'+metric(roundScore(round)+' / '+count,'本輪答對','正確題數')+
      metric(Math.round(roundScore(round)/count*100)+'%','本輪正確率','已完成 '+count+' 題')+'</div>'+
      '<div class="panel"><div class="row wrap-row"><h2>'+(wrong.length?'本輪錯題 · '+wrong.length+' 題':'本輪全部答對')+'</h2>'+
      button('nav','返回首頁','home','class="primary inline"')+'</div>'+
      wrong.map(item=>{
        const question=byId.get(item.id);
        return '<details class="list-row"><summary>'+question.id+' · '+question.prompt+'</summary>'+codeSnippet(question)+solution(question,letters[item.order.indexOf(question.correct)],false)+'</details>';
      }).join('')+'</div>';
  }

  function render(focusTarget) {
    clearTimeout(advanceTimer);
    updateTheme();
    const theme = document.documentElement.dataset.theme;
    navigation.innerHTML = button('nav','<span class="brand-logo">'+icon('chip')+'</span>微處理機模擬題','home','class="brand"')+
      '<div class="top-actions"><nav class="nav" aria-label="主選單">'+Object.entries(views).map(([key,[symbol,label]])=>
        button('nav',icon(symbol)+label,key,view===key?'aria-current="page"':'')).join('')+'</nav>'+
      button('toggle-theme',icon(theme==='dark'?'moon':'sun'),'','class="icon-button" aria-label="切換至'+(theme==='dark'?'淺色':'深色')+'外觀"')+'</div>';
    const renderView = {home,practice,mistakes:mistakesView,stats,settings,library,result};
    app.innerHTML = renderView[view]();
    storageNote.innerHTML = (storageOK?'作答進度儲存在目前的瀏覽器。':'此瀏覽器目前無法儲存進度，本次作答保留到頁面關閉。')+
      (view==='home'?button('nav','瀏覽完整題庫','library','class="text-button"'):'');
    if (focusTarget) focusTarget()?.focus({preventScroll:true});
  }

  function go(target) {
    jumpOpen = false;
    view = target;
    render(() => app.querySelector('h1, legend'));
    window.scrollTo(0,0);
  }

  function start(mode, items) {
    if (!items.length) return;
    if (activeRound()) {
      pendingRound = { mode, items };
      restartDialog.returnValue = 'cancel';
      restartDialog.showModal();
      return;
    }
    beginRound(mode,items);
  }

  restartDialog.addEventListener('click', event => {
    const choice = event.target.closest('button');
    if (choice) restartDialog.close(choice.value);
  });

  restartDialog.addEventListener('close', () => {
    const request = pendingRound;
    pendingRound = null;
    if (restartDialog.returnValue === 'start' && request) beginRound(request.mode,request.items);
  });

  function beginRound(mode, items) {
    const ordered = mode==='ordered' ? items : shuffle(items);
    state.round = {
      mode, index:0, done:false, picks:{}, answers:{},
      items:ordered.map(question=>({ id:question.id, order:mode==='ordered'?[0,1,2,3]:shuffle([0,1,2,3]) })),
    };
    save();
    go('practice');
  }

  function next() {
    const round = state.round;
    if (round.index < round.items.length-1) {
      round.index++;
    } else if (!roundReady(round)) {
      round.index = round.items.findIndex(item => !Object.hasOwn(round.answers,item.id));
    } else {
      round.done = true;
      save();
      go('result');
      return;
    }
    save();
    go('practice');
  }

  function submit() {
    const round = state.round;
    const {id} = round.items[round.index];
    const pick = round.picks[id];
    if (pick===undefined || Object.hasOwn(round.answers,id)) return;
    const correct = pick===byId.get(id).correct;
    round.answers[id]=pick;
    const record = state.records[id] || {attempts:0,correct:0,streak:0};
    record.attempts++;
    if (correct) record.correct++;
    record.streak = correct ? Math.min(record.streak+1,2) : 0;
    state.records[id]=record;
    state.days[dayKey(new Date())]=true;
    save();
    render(() => app.querySelector('#practice-primary'));
    if (correct && state.settings.autoNext) advanceTimer=setTimeout(next,1000);
  }

  document.addEventListener('change', event => {
    const input = event.target;
    if (input.name==='choice' && view==='practice') {
      state.round.picks[state.round.items[state.round.index].id]=Number(input.value);
      save();
      document.getElementById('practice-primary').disabled=false;
    } else if (input.id==='fresh') {
      state.setup.fresh=input.checked;
      save();
      render(() => document.getElementById('fresh'));
    } else if (input.id==='auto-next') {
      state.settings.autoNext=input.checked;
      save();
    }
  });

  document.addEventListener('click', event => {
    const control = event.target.closest('button[data-action]');
    if (!control) return;
    const { action,value } = control.dataset;
    const refocus = () => document.querySelector('button[data-action="'+action+'"][data-value="'+value+'"]');
    switch (action) {
      case 'nav': go(value || 'home'); break;
      case 'mode':
      case 'topic':
      case 'size':
        state.setup[action]=value;
        if (state.setup.mode==='mistakes') state.setup.fresh=false;
        save();
        render(refocus);
        break;
      case 'library-topic': libraryTopic=value; render(refocus); break;
      case 'start': {
        const {mode,topic,size,fresh}=state.setup;
        let pool=candidates(mode,topic,fresh);
        if (mode!=='ordered' && size!=='all') pool=shuffle(pool);
        start(mode,size==='all'?pool:pool.slice(0,Number(size)));
        break;
      }
      case 'practice-mistakes': start('mistakes',mistakes()); break;
      case 'practice-one': start('mistakes',[byId.get(Number(value))]); break;
      case 'resume': if (activeRound()) go('practice'); break;
      case 'toggle-jump': jumpOpen=!jumpOpen; render(refocus); break;
      case 'jump': state.round.index=Number(value); save(); go('practice'); break;
      case 'previous': state.round.index--; save(); go('practice'); break;
      case 'submit': submit(); break;
      case 'next': next(); break;
      case 'toggle-theme': state.settings.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'; save(); render(refocus); break;
      case 'theme': state.settings.theme=value; save(); render(refocus); break;
      case 'reset':
        if (confirm('確定清除這個瀏覽器中的作答紀錄、錯題本與續練進度？')) {
          const settings=state.settings;
          state=newState();
          state.settings=settings;
          save();
          render(refocus);
        }
        break;
    }
  });

  systemTheme.addEventListener('change',() => {
    if (state.settings.theme==='system') updateTheme();
  });
  render();
})();

</script>
</body>
</html>
