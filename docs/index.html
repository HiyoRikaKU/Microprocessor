<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a18">
<title>微處理機模擬題</title>
<style>
:root{color-scheme:dark;--bg:#050a18;--bar:#070d1c;--panel:#10192b;--raised:#172236;--line:#243249;--edge:#364760;--fg:#eef4fb;--muted:#a4b4ca;--accent:#dafa7a;--brand:#dafa7a;--on-brand:#182208;--selection:#27321c;--good:#70e2b4;--good-bg:#112e2e;--bad:#ff9aa9;--bad-bg:#351c30;--track:#23324a;--shadow:#dafa7a1c}
:root[data-theme=light]{color-scheme:light;--bg:#edf3fa;--bar:#f7fbff;--panel:#fff;--raised:#e6eef7;--line:#cfdaea;--edge:#9db0c8;--fg:#142239;--muted:#495e7a;--accent:#46590f;--brand:#dafa7a;--on-brand:#182208;--selection:#eef7ce;--good:#106b4c;--good-bg:#dcf4e7;--bad:#9f183c;--bad-bg:#fce5ec;--track:#d4e0ee;--shadow:#46590f1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default;opacity:.43}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 13px}
button:not(:disabled):hover{border-color:var(--accent)}
button[aria-pressed=true],.picked{border-color:var(--accent);background:var(--selection);color:var(--accent)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:750;box-shadow:0 3px 0 var(--shadow);min-height:47px}
button.primary:not(:disabled):hover{filter:brightness(1.1)}
button.quiet{background:transparent}
svg{width:17px;height:17px;vertical-align:-.2em;flex:none}
.wrap{width:min(100% - 36px,864px);margin-inline:auto}
.topbar{border-bottom:1px solid var(--line);background:var(--bar)}
.topbar-inner{min-height:64px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;font-weight:750;white-space:nowrap}
.brand:hover{color:var(--accent)}
.brand-logo,.tile-icon{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;flex:none}
.brand-logo{background:var(--brand);color:var(--on-brand);box-shadow:0 3px 0 var(--shadow)}
.brand-logo svg,.tile-icon svg{width:19px;height:19px}
.top-actions,.nav{display:flex;align-items:center;gap:5px}
.nav{background:var(--panel);border-radius:12px;padding:4px}
.nav button{display:flex;align-items:center;gap:5px;border-color:transparent;background:transparent;padding:5px 8px;color:var(--muted);font-size:.87rem;white-space:nowrap}
.nav button[aria-current=page]{background:var(--raised);color:var(--fg)}
.icon-button{display:grid;place-items:center;padding:8px;min-width:35px}
main{padding:39px 0 32px}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(1.8rem,5vw,2.3rem);line-height:1.2;margin:6px 0 8px;letter-spacing:-.035em}
h2{font-size:1.07rem}
h3{font-size:.97rem}
.eyebrow{font-size:.77rem;font-weight:800;color:var(--accent);letter-spacing:.18em}
.muted{color:var(--muted)}
.small{font-size:.83rem}
.intro{margin-bottom:17px}
.panel,.shortcut,.metric{background:var(--panel);border:1px solid var(--line);border-radius:16px}
.panel{padding:clamp(16px,3vw,24px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.grow{flex:1}
.wrap-row{flex-wrap:wrap}
.inline{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.mode-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:15px}
.mode{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:4px;padding:16px;min-height:122px;border-radius:15px}
.tile-icon{color:var(--muted);background:var(--raised);margin-bottom:5px}
.mode[aria-pressed=true] .tile-icon{background:var(--brand);color:var(--on-brand)}
.mode strong{color:var(--fg)}
.setup-field{margin-top:22px}
.setup-field h3{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border-radius:999px;border-color:var(--edge);font-size:.82rem;padding:5px 11px}
.count{padding:6px 14px;border-color:var(--edge)}
.checkline{display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-size:.88rem}
input[type=checkbox],input[type=radio]{accent-color:var(--brand)}
.start{width:100%;margin-top:21px}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.shortcut{display:flex;text-align:left;align-items:center;gap:13px;padding:14px 17px}
.shortcut .tile-icon{margin:0;color:var(--accent);background:var(--selection)}
.shortcut:first-child .tile-icon{color:var(--bad);background:var(--bad-bg)}
.resume{margin-bottom:14px}
.footer{padding:0 0 25px;text-align:center;color:var(--muted);font-size:.78rem}
.text-button{border:0;background:none;color:var(--accent);padding:5px}
.practice{width:min(100%,768px);margin-inline:auto}
.practice-head{margin-bottom:14px}
.practice-head .muted{font-size:.81rem}
.progress{display:block;width:100%;height:6px;border:0;border-radius:999px;overflow:hidden;appearance:none;background:var(--track);margin:0 0 18px}
.progress::-webkit-progress-bar{background:var(--track)}
.progress::-webkit-progress-value{background:var(--brand);border-radius:999px}
.progress::-moz-progress-bar{background:var(--brand)}
.practice-card{padding:clamp(16px,4vw,28px)}
.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:15px}
.badge{padding:3px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--raised);font-size:.77rem;color:var(--muted)}
.badge.accent{color:var(--accent);background:var(--selection)}
fieldset{min-inline-size:0;border:0;padding:0;margin:0}
legend{padding:0;margin-bottom:19px;font-size:clamp(1.04rem,2.7vw,1.28rem);font-weight:750;overflow-wrap:anywhere}
.question-code{margin:0 0 16px;padding:12px 14px;max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);tab-size:4}
.question-code code{background:none;border:0;padding:0;color:var(--fg);overflow-wrap:normal;font-size:.87rem;line-height:1.65}
.list-row .question-code{margin:10px 0}
.option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;padding:12px 15px;min-height:57px;margin-top:9px;cursor:pointer;overflow-wrap:anywhere}
.option:first-child{margin-top:0}
.option:hover{border-color:var(--edge)}
.option:has(input:checked:not(:disabled)){border-color:var(--accent);background:var(--selection)}
.option input{position:absolute;width:1px;height:1px;opacity:0}
.option:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.option:has(input:disabled){cursor:default}
.letter{display:grid;place-items:center;flex:none;width:27px;height:27px;border:1px solid var(--line);border-radius:7px;background:var(--bg);font:750 .83rem ui-monospace,monospace}
.option.correct,.q-jump.correct{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.option.wrong,.q-jump.wrong{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.option span:nth-last-child(2){flex:1;min-width:0}
.marker{font-weight:750;margin-left:auto}
code{background:var(--bg);border:1px solid var(--line);color:var(--accent);border-radius:4px;padding:.06em .24em;font: .91em ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}
.solution{border-top:1px solid var(--line);padding-top:12px;margin-top:18px}
.solution p{margin:8px 0}
.solution strong{color:var(--good)}
.solution .wrong-text{color:var(--bad)}
.practice-actions{display:flex;gap:10px;margin-top:14px}
.practice-actions button:first-child{min-width:52px}
.practice-actions .primary{flex:1}
.jump-panel{margin-bottom:14px}
.jump-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(38px,1fr));gap:6px;margin-top:8px}
.q-jump{padding:4px;font-size:.82rem;min-height:32px}
.q-jump[aria-current=step]{outline:2px solid var(--accent);outline-offset:1px}
.section-stack>*+*{margin-top:12px}
.empty{padding:34px 20px;text-align:center}
.empty p{margin:6px 0 12px}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{padding:14px 16px}
.metric strong{display:block;font-size:1.63rem;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--accent);margin-bottom:5px}
.stat-row{padding:11px 0;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0;padding-bottom:0}
.stat-row .progress{margin:6px 0 0}
.list-row{padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{margin-top:8px}
.list-row p{overflow-wrap:anywhere}
.setting p{margin:.3em 0 .7em}
.danger{color:var(--bad)}
details{border-top:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-weight:650;overflow-wrap:anywhere}
.library-options{padding-left:2em;margin:7px 0}
.library-options li::marker{color:var(--muted)}
noscript{display:block;margin:20px}
#restart-dialog{width:min(100% - 28px,420px);color:var(--fg)}
#restart-dialog::backdrop{background:#050a18bd}
#restart-dialog p{margin:8px 0 18px}
#restart-dialog .row{justify-content:flex-end;gap:8px}
@media(max-width:620px){
 .wrap{width:calc(100% - 28px)} main{padding-top:25px}
 .mode-grid{grid-template-columns:1fr;gap:7px}
 .mode{display:grid;grid-template-columns:34px 1fr;column-gap:10px;row-gap:0;min-height:0;padding:10px 12px}
 .mode .tile-icon{grid-row:span 2;width:32px;height:32px;align-self:center;margin:0}
 .nav button{padding:5px;font-size:.8rem}.nav button svg{display:none}.topbar-inner{min-height:57px}
 .brand{gap:6px;font-size:.8rem}.brand-logo{width:30px;height:30px}
 .shortcuts,.metrics{grid-template-columns:1fr 1fr}
 .shortcut{padding:11px;gap:8px}
 .shortcut .tile-icon{width:30px;height:30px}
 .setup-field{margin-top:16px}
}
@media(max-width:359px){.topbar-inner{gap:6px}.brand{font-size:.76rem}.brand-logo{width:27px;height:27px}.top-actions{gap:2px}.nav button{font-size:.77rem;padding:4px}.topbar .icon-button{display:none}.shortcuts{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="wrap topbar-inner" id="navigation"></div></header>
<main class="wrap" id="app"></main>
<footer class="wrap footer" id="storage-note"></footer>
<dialog id="restart-dialog" class="panel" aria-labelledby="restart-title" aria-describedby="restart-note">
  <h2 id="restart-title">開始新一輪？</h2>
  <p id="restart-note" class="muted">新一輪會取代上次的續練位置。已提交的作答紀錄會保留。</p>
  <div class="row wrap-row">
    <button type="button" value="cancel">取消</button>
    <button type="button" value="start" class="primary">開始新一輪</button>
  </div>
</dialog>
<noscript>請啟用 JavaScript 以開啟離線題庫。</noscript>
<script type="application/json" id="quiz-data">{"questions":[{"id":1,"topic":1,"prompt":"在 Apple Silicon Mac 上用系統預設的 \u003ccode>g++\u003c/code> 建置 C++，得到 arm64 Mach-O。TX2 也使用 ARM64，部署前應怎麼做？","options":["改用以 AArch64 Linux 為目標的工具鏈重建","只在 TX2 上執行 \u003ccode>chmod u+x\u003c/code>","將副檔名改成 \u003ccode>.elf\u003c/code>","直接傳送，因為 CPU 指令集一致"],"correct":0,"explanation":"TX2 的 Linux 載入器需要相容的 ELF 格式和 ABI。macOS 的 Mach-O 即使使用同一類 CPU 指令，作業系統的載入方式仍不同。改名或增加執行權限都不會改變二進位格式。","source":"複習筆記 · Lab 1 §2 Host、Target 與 toolchain"},{"id":2,"topic":1,"prompt":"執行 \u003ccode>aarch64-linux-gnu-g++ -c main.cpp -o main.o\u003c/code> 後，下一步要如何得到可執行檔？","options":["把 \u003ccode>main.o\u003c/code> 改名成 \u003ccode>main\u003c/code>","執行 \u003ccode>chmod +x main.o\u003c/code> 以完成組譯","把 \u003ccode>main.o\u003c/code> 重新送入前處理器","將 \u003ccode>main.o\u003c/code> 和其他必要目的檔、函式庫交給 linker"],"correct":3,"explanation":"\u003ccode>-c\u003c/code> 讓編譯流程停在目的檔，尚未把外部符號和其他目的檔接在一起。連結階段解析符號並產生可執行檔。檔名和權限都無法補做這個步驟。","source":"複習筆記 · Lab 1 §3 編譯流程與檔案角色"},{"id":3,"topic":1,"prompt":"規則為 \u003ccode>sort.o: sort.cpp shape.h\u003c/code>。recipe 裡的 \u003ccode>$@\u003c/code> 與 \u003ccode>$&lt;\u003c/code> 分別展開成什麼？","options":["\u003ccode>sort.o\u003c/code>、\u003ccode>shape.h\u003c/code>","\u003ccode>sort.cpp\u003c/code>、\u003ccode>sort.o\u003c/code>","\u003ccode>sort.o\u003c/code>、\u003ccode>sort.cpp\u003c/code>","\u003ccode>sort.cpp\u003c/code>、\u003ccode>shape.h\u003c/code>"],"correct":2,"explanation":"\u003ccode>$@\u003c/code> 指目前 target，\u003ccode>$&lt;\u003c/code> 指第一個 prerequisite。以 \u003ccode>-c $&lt; -o $@\u003c/code> 執行時，會讀 \u003ccode>sort.cpp\u003c/code> 並寫出 \u003ccode>sort.o\u003c/code>。第二個 prerequisite \u003ccode>shape.h\u003c/code> 仍會影響重建判斷。","source":"複習筆記 · Lab 1 §4 Makefile 必懂語法"},{"id":4,"topic":1,"prompt":"已有 \u003ccode>app: main.o sort.o\u003c/code>，目前兩個目的檔都存在，只有 \u003ccode>sort.o\u003c/code> 比 \u003ccode>app\u003c/code> 新。recipe 中哪個變數最適合帶入完整連結清單？","options":["\u003ccode>$^\u003c/code>","\u003ccode>$?\u003c/code>","\u003ccode>$@\u003c/code>","\u003ccode>$&lt;\u003c/code>"],"correct":0,"explanation":"\u003ccode>$^\u003c/code> 展開為全部 prerequisites，所以能連結 \u003ccode>main.o sort.o\u003c/code>。\u003ccode>$?\u003c/code> 此時只會提供較新的 \u003ccode>sort.o\u003c/code>，\u003ccode>$&lt;\u003c/code> 只提供第一個，\u003ccode>$@\u003c/code> 則是輸出的 \u003ccode>app\u003c/code>。","source":"複習筆記 · Lab 1 §4 Makefile 必懂語法"},{"id":5,"topic":1,"prompt":"\u003ccode>main.cpp\u003c/code> include \u003ccode>common.h\u003c/code>，但 Makefile 只有 \u003ccode>main.o: main.cpp\u003c/code>。只改標頭後執行 make，最直接的修正是什麼？","options":["把 \u003ccode>common.h\u003c/code> 放到 \u003ccode>clean\u003c/code> 的刪除清單","把 \u003ccode>common.h\u003c/code> 加入依賴，或納入編譯器產生的 \u003ccode>.d\u003c/code>","把 \u003ccode>main.o\u003c/code> 改成 phony target","把連結指令的 \u003ccode>$^\u003c/code> 改成 \u003ccode>$@\u003c/code>"],"correct":1,"explanation":"make 依賴規則上看得到的檔案和時間戳來決定重建。把標頭列入依賴，或以 \u003ccode>-MMD\u003c/code> 產生並載入 \u003ccode>.d\u003c/code>，才能在標頭更新後精確重編受影響的目的檔。","source":"複習筆記 · Lab 1 §4 Makefile 必懂語法"},{"id":6,"topic":1,"prompt":"專案剛好有一個叫 \u003ccode>clean\u003c/code> 的檔案，\u003ccode>make clean\u003c/code> 因此判定無須執行。怎麼處理最合適？","options":["把 \u003ccode>clean\u003c/code> 放在第一條 target 規則","把 \u003ccode>clean\u003c/code> 改成 \u003ccode>clean.o\u003c/code>","在刪除命令加上 \u003ccode>-f\u003c/code>","宣告 \u003ccode>.PHONY: clean\u003c/code>"],"correct":3,"explanation":"\u003ccode>clean\u003c/code> 是要執行的動作。標成 phony 後，make 在要求該 target 時會執行 recipe，不以同名檔案的時間戳判斷。刪除命令的 \u003ccode>-f\u003c/code> 只有在 recipe 已執行時才會起作用。","source":"複習筆記 · Lab 1 §4 Makefile 必懂語法"},{"id":7,"topic":1,"prompt":"Makefile 的編譯命令前用了四個空格，執行時顯示 \u003ccode>missing separator\u003c/code>。按課堂預設語法，首先該修正哪裡？","options":["把 recipe 行前的空格改成 Tab","在來源檔後面加上 \u003ccode>-std=c++11\u003c/code>","把 target 後的冒號換成等號","把執行檔放到 TX2 的家目錄"],"correct":0,"explanation":"預設 Makefile 語法用 Tab 標記 recipe 行。這個錯誤發生於 make 解析規則時，編譯器還沒開始執行。先修正縮排，再處理 C++ 編譯錯誤。","source":"複習筆記 · Lab 1 §6 易錯點與除錯順序"},{"id":8,"topic":1,"prompt":"編譯各個 \u003ccode>.o\u003c/code> 都成功，最後卻出現 \u003ccode>undefined reference to area()\u003c/code>。第一步最適合查什麼？","options":["實作 \u003ccode>area()\u003c/code> 的目的檔是否進入連結清單，宣告與定義是否一致","\u003ccode>area()\u003c/code> 所在檔案是否有執行權限","主程式是否以 \u003ccode>sudo\u003c/code> 啟動","TX2 的 SSH port 是否開啟"],"correct":0,"explanation":"連結器找不到呼叫所需的符號時會報 undefined reference。先查實作所在目的檔及函式簽名，例如參數型別和 namespace，再查連結順序或函式庫。","source":"複習筆記 · Lab 1 §6 易錯點與除錯順序"},{"id":9,"topic":1,"prompt":"從開發機將 \u003ccode>tx2_exe\u003c/code> 傳到 TX2 使用者 \u003ccode>nvidia\u003c/code> 的家目錄，哪個指令方向正確？","options":["\u003ccode>scp ./tx2_exe ~/nvidia@192.168.55.1\u003c/code>","\u003ccode>scp nvidia@192.168.55.1:~/tx2_exe ./\u003c/code>","\u003ccode>scp ./tx2_exe nvidia@192.168.55.1:~/\u003c/code>","\u003ccode>ssh nvidia@192.168.55.1 ./tx2_exe\u003c/code>"],"correct":2,"explanation":"SCP 的第一個路徑是來源，第二個是目的地。冒號前的 \u003ccode>user@host\u003c/code> 代表遠端端點。SSH 可以遠端執行已有的檔案，這個用法不會上傳本機檔案。","source":"複習筆記 · Lab 1 §5 完整操作流程"},{"id":10,"topic":1,"prompt":"SCP 傳輸完成，TX2 執行 \u003ccode>./tx2_exe\u003c/code> 回報 \u003ccode>Exec format error\u003c/code>。哪組檢查最直接？","options":["用 \u003ccode>dmesg\u003c/code> 找 GPIO 編號，再重設方向","用 \u003ccode>ls -l\u003c/code> 查權限，再一律改成 777","用 \u003ccode>pwd\u003c/code> 確認路徑，再改檔名","用 \u003ccode>file tx2_exe\u003c/code> 查產物，用 \u003ccode>uname -m\u003c/code> 查 TX2 架構"],"correct":3,"explanation":"\u003ccode>file\u003c/code> 描述該二進位產物，\u003ccode>uname -m\u003c/code> 描述目前機器。把兩者對照可找出把 x86-64 ELF 或 Mach-O 誤傳到 AArch64 Linux 的情況。SCP 只負責傳輸位元組。","source":"複習筆記 · Lab 1 §6 易錯點與除錯順序"},{"id":11,"topic":1,"prompt":"換領 TX2 後沿用相同 IP，SSH 提示 host key changed。應先做什麼？","options":["直接在所有 SSH 連線停用 host key 檢查","重新用同一套 Makefile 編譯","重設 TX2 的使用者密碼","用可信方式確認新機台的指紋，確認後才移除舊紀錄"],"correct":3,"explanation":"host key 用來辨認 SSH 伺服器。同一個 IP 可以對到不同設備，換板確實可能產生這個警告。先確認新指紋，再更新該 IP 的舊紀錄，才能維持設備身分驗證。","source":"複習筆記 · Lab 1 §5 完整操作流程"},{"id":12,"topic":1,"prompt":"Lab 1 已提供形狀計算與排序原始碼，哪個工作最符合原實驗目標？","options":["將排序規則改為降冪以驗證連結結果","自行寫 Makefile 建出目標執行檔，傳至 TX2 並比對執行結果","把每種形狀改寫成 shell script，在主機直接執行","只完成 \u003ccode>clean\u003c/code>，以移除原始碼作為驗收"],"correct":1,"explanation":"實驗用現成形狀程式練習相依規則、跨平台工具鏈與遠端執行。驗收會涉及 \u003ccode>all\u003c/code>、\u003ccode>clean\u003c/code>、變數、自動變數以及 TX2 執行。修改演算法無法取代這些步驟。","source":"複習筆記 · Lab 1 §1 原教材要求"},{"id":13,"topic":2,"prompt":"依 Lecture 2 的 TX2 對照，J21 實體 Pin 15 對應 \u003ccode>gpio255\u003c/code>。若程式把 LED1 接在這個腳位，寫入 \u003ccode>export\u003c/code> 的數字應為何？","options":["1","254","255","15"],"correct":2,"explanation":"\u003ccode>export\u003c/code> 接收 sysfs GPIO number，因此寫入 255。15 是接頭位置，LED1 是程式自己定義的名稱。三種標識要靠對照表連接起來。","source":"複習筆記 · Lab 2 §2 三層編號一定分清楚"},{"id":14,"topic":2,"prompt":"假設 \u003ccode>gpio255\u003c/code> 尚未 export 且介面可用，要將它設成輸出高電位，哪個順序正確？","options":["對 \u003ccode>export\u003c/code> 寫 out → 對 \u003ccode>value\u003c/code> 寫 255 → 設 \u003ccode>direction=1\u003c/code>","對 \u003ccode>export\u003c/code> 寫 255 → 對 \u003ccode>direction\u003c/code> 寫 out → 對 \u003ccode>value\u003c/code> 寫 1","先寫 \u003ccode>value=1\u003c/code> → 對 \u003ccode>export\u003c/code> 寫 255 → 設 \u003ccode>direction=in\u003c/code>","對 \u003ccode>unexport\u003c/code> 寫 255 → 對 \u003ccode>direction\u003c/code> 寫 out → 對 \u003ccode>value\u003c/code> 寫 1"],"correct":1,"explanation":"先把 GPIO 暴露到 sysfs，才有該腳位目錄可設定。寫 out 建立輸出方向，接著寫 1 設定高電位。unexport 則移除供使用者空間操作的介面。","source":"複習筆記 · Lab 2 §3 sysfs 的四個操作"},{"id":15,"topic":2,"prompt":"一般使用者執行 \u003ccode>sudo echo 1 &gt; /sys/class/gpio/gpio255/value\u003c/code> 仍收到權限錯誤。在允許以 sudo 寫此 GPIO 的前提下，哪個解法對準問題？","options":["在路徑末尾多加一個斜線","把 \u003ccode>echo\u003c/code> 改成 \u003ccode>printf\u003c/code>，保留原本重導向","\u003ccode>echo 1 | sudo tee /sys/class/gpio/gpio255/value\u003c/code>","將 \u003ccode>value\u003c/code> 改成 \u003ccode>direction\u003c/code>"],"correct":2,"explanation":"\u003ccode>&gt;\u003c/code> 由目前 shell 開啟目標檔案。sudo 只提升 echo 的身分，沒有提升 shell 的重導向權限。讓具備權限的 tee 接收標準輸入並寫入，才會改變實際寫檔者。","source":"複習筆記 · Lab 2 §3 sysfs 的四個操作"},{"id":16,"topic":2,"prompt":"執行 \u003ccode>./L2Program Mode_Shine 5\u003c/code> 時，\u003ccode>argc\u003c/code> 和 \u003ccode>argv[2]\u003c/code> 的內容是什麼？","options":["3 和整數 \u003ccode>5\u003c/code>","2 和字串 \u003ccode>&quot;5&quot;\u003c/code>","2 和字串 \u003ccode>&quot;Mode_Shine&quot;\u003c/code>","3 和字串 \u003ccode>&quot;5&quot;\u003c/code>"],"correct":3,"explanation":"\u003ccode>argv[0]\u003c/code> 存程式名稱或路徑，接著才是模式和次數。命令列參數以字串傳入，程式還需要自行解析 \u003ccode>&quot;5&quot;\u003c/code> 並驗證範圍。","source":"複習筆記 · Lab 2 §4 argv 怎麼變成 LED 操作？"},{"id":17,"topic":2,"prompt":"程式剛啟動時只有 \u003ccode>argv[0]\u003c/code>，卻先拿 \u003ccode>argv[2]\u003c/code> 建立字串。哪個修改能防止這類問題？","options":["發現燈沒亮後再讀 argc","先呼叫 \u003ccode>export\u003c/code>，等 sysfs 建好再讀 argv","先驗證 argc，再依模式讀取必需的 argv","把所有參數比對改成整數相等"],"correct":2,"explanation":"命令列缺少參數時，不能假設索引 2 有可讀字串。應先檢查參數數量，再依模式驗證 LED、on/off 或次數。這個檢查應早於硬體操作，避免無效命令改變輸出。","source":"複習筆記 · Lab 2 §4 argv 怎麼變成 LED 操作？"},{"id":18,"topic":2,"prompt":"目前四燈狀態為 \u003ccode>[亮, 滅, 亮, 滅]\u003c/code>，Lab 2 執行 \u003ccode>LED2 on\u003c/code> 後應得到哪種結果？","options":["\u003ccode>[亮, 滅, 亮, 滅]\u003c/code>","\u003ccode>[亮, 亮, 亮, 滅]\u003c/code>","\u003ccode>[亮, 亮, 滅, 滅]\u003c/code>","\u003ccode>[滅, 亮, 滅, 滅]\u003c/code>"],"correct":1,"explanation":"Lab 2 的單燈命令只更新指定腳位。LED2 從滅改亮，LED1 和 LED3 保持亮，LED4 保持滅。清空全部輸出再設 LED2 會破壞這個要求。","source":"複習筆記 · Lab 2 §1 原教材要求與行為邊界"},{"id":19,"topic":2,"prompt":"兩組閃爍中，第一組為 LED1、LED2，第二組為 LED3、LED4。以 1 表示亮，哪兩個四燈狀態應交替？","options":["\u003ccode>1010\u003c/code> 與 \u003ccode>0101\u003c/code>","\u003ccode>1100\u003c/code> 與 \u003ccode>0011\u003c/code>","\u003ccode>1000\u003c/code> 與 \u003ccode>0100\u003c/code>","\u003ccode>1111\u003c/code> 與 \u003ccode>0000\u003c/code>"],"correct":1,"explanation":"先依原要求把相鄰兩顆分成一組。第一組亮時是 \u003ccode>1100\u003c/code>，第二組亮時是 \u003ccode>0011\u003c/code>。兩個狀態間需保留可觀察的時間間隔。","source":"複習筆記 · Lab 2 §1 原教材要求與行為邊界"},{"id":20,"topic":2,"prompt":"程式剛收到指令，便把四個 GPIO 全設為 0 作為初始化。若要保留 Lab 2 單燈行為，哪個調整較合理？","options":["分開準備資源和設定輸出，單燈命令只寫指定腳位","每次執行前先保存 LED 名稱，仍然將四燈歸零","先把四燈全設為 1，再將指定燈設成目標值","程式結束時才一次改成全滅"],"correct":0,"explanation":"「其他燈不變」約束的是整個命令的輸出行為。初始化或收尾全改輸出都會破壞它。將 GPIO 資源準備和真正寫入分開，就能把變更限制在指定腳位。","source":"複習筆記 · Lab 2 §5 實作驗證與除錯"},{"id":21,"topic":2,"prompt":"\u003ccode>gpio255/value\u003c/code> 已讀回 1，實體 LED 卻沒亮。哪個驗證最能把軟體設定與接線分開？","options":["先增加命令列 argv 的數量","把 GPIO 讀回值 1 當作 LED 已亮的證據","把 \u003ccode>value\u003c/code> 的內容改寫為字串 \u003ccode>on\u003c/code>","確認 Pin 1 方向及映射，量測實際輸出並檢查極性、限流、共地"],"correct":3,"explanation":"sysfs 回報的是軟體可讀的邏輯狀態，LED 是否有電流還取決於實際接線。量測對應腳位並檢查極性、限流電阻和共地，可區分程式設定與硬體路徑。","source":"複習筆記 · Lab 2 §5 實作驗證與除錯"},{"id":22,"topic":2,"prompt":"確認只由本程式使用的 GPIO 已完成操作，現在要移除它的 sysfs 介面。應寫入哪裡？","options":["向 \u003ccode>gpioN/direction\u003c/code> 寫入 \u003ccode>close\u003c/code>","向 \u003ccode>gpioN/value\u003c/code> 寫入 GPIO number","將 \u003ccode>gpioN\u003c/code> 當成普通目錄遞迴刪除","向 \u003ccode>/sys/class/gpio/unexport\u003c/code> 寫入 GPIO number"],"correct":3,"explanation":"sysfs 目錄由核心提供，\u003ccode>unexport\u003c/code> 是移除已 export GPIO 介面的操作。若還要保證 LED 最終熄滅，應先依接線設定適當輸出，再釋放本程式所管理的腳位。","source":"複習筆記 · Lab 2 §3 sysfs 的四個操作"},{"id":23,"topic":2,"prompt":"插上彩虹排線後，兩排腳位在觀察方向上可能與原接頭圖相反。可靠的確認方式為何？","options":["直接用排線第一種顏色當作 LED1","把所有奇數 GPIO number 改成偶數","先定位 Pin 1 和 GND，再以接頭及轉接板對照表確認","把排線另一頭第一個位置固定當作 Pin 40"],"correct":2,"explanation":"實體方向是映射的第一步。依 Pin 1、GND 和標示找出正確位置，再對照 sysfs number。排線顏色與 Linux GPIO 編號的奇偶沒有通用關係。","source":"複習筆記 · Lab 2 §2 三層編號一定分清楚"},{"id":24,"topic":2,"prompt":"在較新的 Linux 環境看見 \u003ccode>/dev/gpiochip0\u003c/code>，沒有舊課程的 \u003ccode>/sys/class/gpio/export\u003c/code>。哪個說法合理？","options":["先建立普通檔案 \u003ccode>/sys/class/gpio/export\u003c/code> 以啟用驅動","把 255 寫入 \u003ccode>/dev/gpiochip0/export\u003c/code> 就能用同一套流程","環境可能採 GPIO character device API，需依核心與對應工具操作","缺少 export 就表示系統完全沒有 GPIO"],"correct":2,"explanation":"sysfs 與 character device 是不同 ABI。較新的環境可用 gpiochip 與 line offset，不能直接沿用舊 sysfs 路徑或把全域編號當成 offset。TX2 實驗仍應以該機核心所支援的介面為準。","source":"複習筆記 · Lab 2 §3 sysfs 的四個操作"},{"id":25,"topic":2,"prompt":"兩組 LED 切換極快，肉眼像全都亮著，CPU 使用率也偏高。哪個修改最可能同時改善兩個現象？","options":["將次數字串改為長整數","每次切換前重做 cross-compile","把兩組的 LED 交換成奇數和偶數","每組狀態維持可觀察的間隔，避免忙迴圈"],"correct":3,"explanation":"缺少等待時，程式會盡可能快地改變輸出，肉眼可能看不清明暗交替，CPU 也會持續忙碌。保留明確間隔或採計時機制，可以讓交替行為可驗證。","source":"複習筆記 · Lab 2 §5 實作驗證與除錯"},{"id":26,"topic":2,"prompt":"若要用 TX2 的 GPIO 量到光敏分壓點的多階電壓值，Lab 5 新增了什麼環節？","options":["把 GPIO 的 \u003ccode>direction\u003c/code> 設成 \u003ccode>analog\u003c/code>","用 MCP3008 取樣與量化，再經 SPI 讀取結果","連續讀兩個 GPIO，取平均後即可量電壓","將 \u003ccode>value\u003c/code> 轉成浮點數，就能取得實際電壓"],"correct":1,"explanation":"課程 GPIO 讀取的是邏輯高低。MCP3008 將類比電壓量化成 10-bit 數字，主機再以 SPI 讀到轉換碼。數值型別的轉換無法增加原本輸入的量測解析度。","source":"複習筆記 · Lab 2 §3 sysfs 的四個操作"},{"id":27,"topic":3,"prompt":"Qt Creator、qmake 和 C++ 編譯器在 Lab 3 分別做什麼？","options":["GUI 框架、連結器、編輯器","編譯器、IDE、生成 \u003ccode>.ui\u003c/code>","IDE、生成建置規則、編譯 C++ 原始碼","執行 GPIO、顯示圖片、處理鍵盤"],"correct":2,"explanation":"Qt Creator 管理專案、kit 與建置介面。qmake 依 \u003ccode>.pro\u003c/code> 和工具鏈設定生成 Makefile，再由所選的編譯器執行 C++ 編譯。","source":"複習筆記 · Lab 3 §2 Qt 幾個名稱別混用"},{"id":28,"topic":3,"prompt":"專案中要調整 Qt Designer 的畫面元件配置，優先應查看哪個檔案？","options":["\u003ccode>.pro\u003c/code>","\u003ccode>.ui\u003c/code>","\u003ccode>.o\u003c/code>","\u003ccode>.ko\u003c/code>"],"correct":1,"explanation":"\u003ccode>.ui\u003c/code> 描述介面，\u003ccode>.pro\u003c/code> 描述建置所需的 sources、forms 等配置。\u003ccode>.o\u003c/code> 是編譯產物，\u003ccode>.ko\u003c/code> 則是核心模組。畫面事件處理通常另外寫在 C++ 實作檔。","source":"複習筆記 · Lab 3 §2 Qt 幾個名稱別混用"},{"id":29,"topic":3,"prompt":"下列哪項最符合 Qt MOC 的用途？","options":["在執行期自動掃描 J21 腳位","把 ARM 可執行檔轉成 x86 可執行檔","從含 Qt 物件宣告的 C++ 程式生成 meta-object 所需的程式碼","將 \u003ccode>.ui\u003c/code> 和 Linux kernel headers 合成 \u003ccode>.ko\u003c/code>"],"correct":2,"explanation":"MOC 支援 Qt 的 meta-object 機制，例如含 \u003ccode>Q_OBJECT\u003c/code> 的類別。它和跨平台編譯及 GPIO 接線各在不同層次。qmake 可把 MOC 的生成工作納入建置規則。","source":"複習筆記 · Lab 3 §2 Qt 幾個名稱別混用"},{"id":30,"topic":3,"prompt":"在 \u003ccode>connect(button, &amp;QPushButton::clicked, this, &amp;MainWindow::startRunning)\u003c/code> 中，哪個會在按鈕事件發生時執行？","options":["直接卸載按鈕物件","再執行一次 \u003ccode>connect\u003c/code> 才會有反應","呼叫 \u003ccode>qmake\u003c/code> 以生成新事件","接收端的 \u003ccode>startRunning\u003c/code>"],"correct":3,"explanation":"按鈕發出 clicked signal，連線將事件交給接收端的 slot。連線通常在初始化建立一次，後續每次點擊就會依該關聯執行對應邏輯。","source":"複習筆記 · Lab 3 §3 Signal、slot 與 event loop"},{"id":31,"topic":3,"prompt":"使用者按下切換模式後，slot 裡的無限迴圈持續 sleep，其他按鈕也失去反應。最適合的修法為何？","options":["在迴圈中持續重接 clicked signal","把所有 QPushButton 換成 QLabel","改用更長的 sleep，讓按鈕有更多時間觸發","用 QTimer 的 timeout 每次更新一個狀態，再返回 event loop"],"correct":3,"explanation":"GUI 執行緒若卡在同一個 slot，就無法處理後續輸入和重繪。QTimer 讓更新分散成短回呼，event loop 可以在兩次 timeout 之間處理停止與反轉。","source":"複習筆記 · Lab 3 §3 Signal、slot 與 event loop"},{"id":32,"topic":3,"prompt":"Lab 3 的 LED Shining 執行前四顆燈全亮，現在只勾 LED2 和 LED4。按下按鈕後應顯示哪個狀態？","options":["\u003ccode>[滅, 亮, 滅, 亮]\u003c/code>，圖片與實燈同步","\u003ccode>[亮, 亮, 亮, 亮]\u003c/code>，只將勾選燈設為亮","\u003ccode>[亮, 滅, 亮, 滅]\u003c/code>，以反相顯示勾選","畫面顯示 \u003ccode>[滅, 亮, 滅, 亮]\u003c/code>，GPIO 維持全亮"],"correct":0,"explanation":"LED Shining 用四個 checkbox 決定完整的輸出狀態。未勾選的 LED1 和 LED3 應熄滅。UI 和 GPIO 應套用同一個狀態，避免畫面與實體結果分歧。","source":"複習筆記 · Lab 3 §1 原教材要求"},{"id":33,"topic":3,"prompt":"流水燈目前 \u003ccode>currentIndex=0\u003c/code>，方向是 \u003ccode>-1\u003c/code>，索引範圍 0 到 3。哪個運算能得到下一格 3？","options":["\u003ccode>(currentIndex - direction + 4) % 4\u003c/code>","\u003ccode>(currentIndex + 4) % 4\u003c/code>","\u003ccode>(currentIndex + direction) % 4\u003c/code>","\u003ccode>(currentIndex + direction + 4) % 4\u003c/code>"],"correct":3,"explanation":"代入後是 \u003ccode>(0 - 1 + 4) % 4 = 3\u003c/code>。這裡先加一個完整週期，避免 C++ 的負餘數成為陣列索引。最後一個選項會反向套用 direction，得到 1。","source":"複習筆記 · Lab 3 §4 用狀態描述燈，不讓按鈕各自亂寫"},{"id":34,"topic":3,"prompt":"流水燈目前亮 LED3，正向本來要走向 LED4。此時按 Change Direction，下次更新應怎麼做？","options":["保留目前位置，下一格照樣亮 LED4","先重設成 LED1，再沿舊方向繼續","保留目前位置，下一格改亮 LED2","立即結束流水燈並清掉目前位置"],"correct":2,"explanation":"反轉改變的是前進方向。若目前索引是 2，將方向設為 -1 後，下一格索引是 1，也就是 LED2。保留目前位置可讓反轉從當下狀態接續。","source":"複習筆記 · Lab 3 §4 用狀態描述燈，不讓按鈕各自亂寫"},{"id":35,"topic":3,"prompt":"使用者在 Running 模式按停止，哪組狀態變更最完整？","options":["只清空四燈，讓 timer 在下一拍重新寫入","停止 timer、清空 LED 輸出並更新畫面","只把圖片隱藏，讓實體燈繼續跑","只停止 timer，保留最後一顆亮燈"],"correct":1,"explanation":"停止有兩個結果。未來的 timeout 不再驅動流水燈，當前的燈與示意圖也都關閉。漏掉其中一部分會留下舊畫面、實體亮燈或下一拍復亮。","source":"複習筆記 · Lab 3 §4 用狀態描述燈，不讓按鈕各自亂寫"},{"id":36,"topic":3,"prompt":"教學範例把 1% 對到 1000 ms，100% 對到 100 ms。若提高 speed 後看起來更慢，最可能是哪一類錯誤？","options":["把較大的速度值錯誤映射成更長的 interval","把 Qt Creator 改成另一個主題","把秒數換成毫秒時多乘了一次 GPIO 編號","讓 slider 與 progress bar 顯示相同數字"],"correct":0,"explanation":"interval 是每次更新之間的等待時間。等待越長，閃爍或移動越慢。速度百分比和毫秒是不同單位，映射的方向也要符合 UI 的語意。","source":"複習筆記 · Lab 3 §5 速度與元件連動"},{"id":37,"topic":3,"prompt":"滑鼠和快捷鍵都能啟動 Switching，哪個設計最能避免兩者結果不同？","options":["各寫一套狀態機，分別使用自己的 timer","兩種輸入都呼叫同一個模式切換函式","快捷鍵只改畫面，把實燈留給下一次滑鼠操作","快捷鍵只更新 checkbox，滑鼠只操作 GPIO"],"correct":1,"explanation":"共用模式切換函式可讓狀態、timer 和輸出採同一套規則。輸入來源只負責送事件，避免其中一條路徑少做了停用前一模式或同步畫面。","source":"複習筆記 · Lab 3 §5 速度與元件連動"},{"id":38,"topic":3,"prompt":"LED QTE 目前 80 分，按對一次之後的合理行為是什麼？","options":["加 20 到 100，但把同一題留著繼續接受按鍵","加 20 到 100，結束當局並呈現過關","加 10 到 90，繼續同一題","分數歸零，因為應保留到下局才計分"],"correct":1,"explanation":"依課程要求，每次答對得 20 分，100 分通關。回合達標後應轉入結束狀態，避免多餘按鍵改動已結束的分數或 LED 狀態。","source":"複習筆記 · Lab 3 §6 QTE 的重點是回合狀態"},{"id":39,"topic":3,"prompt":"把 Qt 專案原始碼傳到 TX2，在 TX2 執行 \u003ccode>qmake\u003c/code> 和 \u003ccode>make\u003c/code>，且使用 TX2 原生工具鏈。這是哪種建置？","options":["在 Mac 上進行 ARM Linux cross-compilation","透過 SSH 將現成的 macOS 執行檔轉換格式","在瀏覽器進行程式轉譯","TX2 上的 native build"],"correct":3,"explanation":"實際建置發生在 TX2，工具鏈也以本機環境為目標，因此是 native build。SSH 只是遠端操作方式，qmake 也只是產生與所選工具鏈相符的規則。","source":"複習筆記 · Lab 3 §7 部署與除錯"},{"id":40,"topic":3,"prompt":"SSH 能登入 TX2，啟動 Qt 程式卻顯示無法連接 display。哪個檢查最直接？","options":["把 \u003ccode>.pro\u003c/code> 重新命名成 \u003ccode>.ui\u003c/code>","將 C++ 編譯選項全改成 \u003ccode>-O0\u003c/code>","改用不同 sysfs number","確認圖形 session、DISPLAY 與客戶端 X server／X forwarding"],"correct":3,"explanation":"遠端 shell 與 GUI 顯示是兩條路徑。SSH 登入成功代表文字連線可用，GUI 仍需要可用的顯示環境或 X forwarding。這個錯誤應先在顯示層排查。","source":"複習筆記 · Lab 3 §7 部署與除錯"},{"id":41,"topic":4,"prompt":"手機瀏覽器按下 LED 控制按鈕，哪條路徑最符合 Lab 4？","options":["Express 將網頁複製到 LED → LED 解析 HTML","瀏覽器送 HTTP → TX2 Node.js 驗證參數 → GPIO 控制程式 → LED","GPIO 先送 HTTP 到手機 → npm 啟動 LED","瀏覽器執行 TX2 的 C++ 二進位檔 → 手機腳位 → TX2 LED"],"correct":1,"explanation":"瀏覽器負責傳送請求和呈現結果。TX2 端的 Node.js／Express 解析請求，再由具備 GPIO 存取權的控制程式改變輸出。","source":"複習筆記 · Lab 4 §2 從表單到硬體的完整路徑"},{"id":42,"topic":4,"prompt":"在 Lab 4 中，哪一項正確配對 Node.js、Express、npm 的角色？","options":["Web server 的硬體、JavaScript 編譯器、Linux shell","套件管理工具、瀏覽器、GPIO ABI","Web 框架、Linux kernel driver、JavaScript runtime","JavaScript runtime、Web 框架、套件管理工具"],"correct":3,"explanation":"Node.js 提供 JavaScript 執行環境。Express 在該環境提供 route 與 middleware 等功能，npm 用來管理與安裝專案依賴。","source":"複習筆記 · Lab 4 §2 從表單到硬體的完整路徑"},{"id":43,"topic":4,"prompt":"GET 表單使用 \u003ccode>&lt;input name=&quot;led&quot; value=&quot;LED2&quot;&gt;\u003c/code>。Express 路由要讀取它，鍵和值是哪一組？","options":["\u003ccode>req.query.led\u003c/code>，值為 \u003ccode>LED2\u003c/code>","\u003ccode>req.query.LED2\u003c/code>，值為 \u003ccode>led\u003c/code>","\u003ccode>req.body.LED2\u003c/code>，值為 \u003ccode>led\u003c/code>","\u003ccode>req.params.led\u003c/code>，值為 \u003ccode>LED2\u003c/code>"],"correct":0,"explanation":"表單的 name 決定參數名稱，value 決定內容。GET 表單將資料放入 query string，對應 Express 的 req.query。req.params 則用於路由路徑參數。","source":"複習筆記 · Lab 4 §3 HTML 與後端參數怎麼對應？"},{"id":44,"topic":4,"prompt":"使用 \u003ccode>POST\u003c/code> 送出預設 HTML 表單的 URL-encoded 資料。伺服器要從 \u003ccode>req.body\u003c/code> 讀取欄位，應先設定什麼？","options":["靜態圖片的 MIME type","為路由開啟 X forwarding","GPIO 的 \u003ccode>direction\u003c/code>","對應的 URL-encoded body parser"],"correct":3,"explanation":"POST 表單資料放在 request body。Express 要先經適合其格式的 middleware 解析，後續 handler 才能以 req.body 取值。GET query 的解析方式不同。","source":"複習筆記 · Lab 4 §3 HTML 與後端參數怎麼對應？"},{"id":45,"topic":4,"prompt":"使用相同 \u003ccode>name=&quot;led&quot;\u003c/code> 的 checkbox 讓使用者多選。後端最需要預先處理哪些情況？","options":["每次收到的欄位型別一定是整數","未勾選、單一值、多個值","每次一定收到固定四個 LED 值","未勾選時一律收到字串 \u003ccode>false\u003c/code>"],"correct":1,"explanation":"未勾選的 checkbox 通常不會成為表單資料。重複的 name 可能有多值，實際表現還取決於 parser。先把合法輸入正規化為列表，才能一致驗證與執行。","source":"複習筆記 · Lab 4 §3 HTML 與後端參數怎麼對應？"},{"id":46,"topic":4,"prompt":"網頁已顯示「已送出 LED3 on」。要進一步說明 TX2 的程式已成功執行，後端至少要多做什麼？","options":["在送出後直接假設燈已亮","把 GET 改成 POST 即可保證成功","檢查子程序結果，再回報成功或錯誤","在網頁上把文字顏色改成綠色"],"correct":2,"explanation":"送出代表前端發出請求。後端檢查 exit code 或 callback 錯誤後，才有程式執行結果。若要確認實燈真的亮，還需要對應的讀回或觀察證據。","source":"複習筆記 · Lab 4 §3 HTML 與後端參數怎麼對應？"},{"id":47,"topic":4,"prompt":"後端已知要執行固定的 \u003ccode>gpio\u003c/code> 檔案，LED 和 on/off 來自使用者輸入。哪種做法較合適？","options":["用 \u003ccode>fork\u003c/code> 將 C++ 執行檔當成 Node.js 模組","將輸入當成新的可執行檔路徑","用 \u003ccode>exec\u003c/code> 將使用者輸入直接拼成 shell 命令","驗證參數後，使用 \u003ccode>execFile(file, [led, power], callback)\u003c/code>"],"correct":3,"explanation":"execFile 預設直接執行檔案，參數以陣列傳入。白名單能先排除不合法的 LED 與 power，並減少使用者輸入被 shell 當成語法的機會。","source":"複習筆記 · Lab 4 §4 child_process 的四個 API"},{"id":48,"topic":4,"prompt":"控制工作會持續輸出多行日誌，後端想逐段接收，而非等全部輸出收集完才處理。哪個 API 最貼近需求？","options":["\u003ccode>execSync\u003c/code> 並在 HTTP handler 等待完成","\u003ccode>exec\u003c/code> 並只讀最後的 callback 結果","\u003ccode>spawn\u003c/code> 並監聽子程序的 stdout stream","\u003ccode>npm install\u003c/code> 並讀取 package.json"],"correct":2,"explanation":"spawn 回傳 ChildProcess，可透過 stdout／stderr streams 讀取輸出。exec 的 callback 則適合取得結束後緩衝的內容。同步執行會占住 server 的事件迴圈。","source":"複習筆記 · Lab 4 §4 child_process 的四個 API"},{"id":49,"topic":4,"prompt":"使用 Node.js 的 \u003ccode>fork\u003c/code> 開一個 Node 子程序，主要如何在父子程序間交換控制訊息？","options":["使用 IPC 通道傳送訊息","只靠 HTTP query string 自動同步","共用同一個 process ID","直接讀寫同一個 JavaScript 區域變數"],"correct":0,"explanation":"fork 建立子程序與 IPC 通道。兩個程序各有自己的 JavaScript 狀態，應明確傳送啟動、停止或反轉訊息。父程序中的區域變數不會自動複製後持續同步。","source":"複習筆記 · Lab 4 §4 child_process 的四個 API"},{"id":50,"topic":4,"prompt":"每次按 Running Light on 都新建一個無限閃燈程序，Stop 偶爾失效。最合理的重構為何？","options":["每次按 Stop 再啟動一個清燈程序，但不處理既有工作","維護單一控制器或子程序 handle，讓開始、停止、反轉作用於同一狀態","將燈光狀態存進瀏覽器按鈕文字","在每次 request 的區域變數保存方向，用完就丟棄"],"correct":1,"explanation":"多個持續執行的程序會同時寫入同一組 LED。即使清燈一次，舊程序仍可在下一拍覆寫輸出。將持續工作集中管理後，後續請求才有同一個操作對象。","source":"複習筆記 · Lab 4 §5 如何讓流水燈可停止與反轉？"},{"id":51,"topic":4,"prompt":"某 route 用無限同步迴圈更新 LED。網頁仍顯示，但新的 off 請求一直等不到回應。哪個改動可直接解決阻塞？","options":["使用非阻塞 timer 或受控子程序，讓 handler 能返回","把 port 改成 80，維持原迴圈","把迴圈的等待改成同步 busy-wait","加上另一個同步迴圈檢查 off 參數"],"correct":0,"explanation":"Node.js 需要事件迴圈處理新 HTTP 請求。同步無限迴圈占住執行緒，使 off 請求沒有機會被處理。將持續更新移出長時間 handler 後，伺服器可回應後續命令。","source":"複習筆記 · Lab 4 §5 如何讓流水燈可停止與反轉？"},{"id":52,"topic":4,"prompt":"在 TX2 上打開 \u003ccode>localhost:8080\u003c/code> 正常，筆電連 TX2 的正確 IP 和 port 卻失敗。哪項最應先查？","options":["是否要在瀏覽器安裝 Express","伺服器是否只綁 loopback，以及兩端網路和防火牆","是否必須先修改 LED 的實體 Pin 15","是否應先把所有 GET 改成 POST"],"correct":1,"explanation":"TX2 本機能開網頁，表示服務至少在本機某個位址可用。若只監聽 loopback，其他主機連不上。應先看 listen 位址，再檢查網路可達性與防火牆。","source":"複習筆記 · Lab 4 §6 連線與部署怎麼分層查？"},{"id":53,"topic":4,"prompt":"筆電用 USB SSH 可進 TX2，TX2 上的 npm 卻無法解析 registry 網域。哪個測試能直接確認名稱解析？","options":["在 TX2 執行 \u003ccode>getent hosts registry.npmjs.org\u003c/code>","在 TX2 執行 \u003ccode>lsmod\u003c/code>","在筆電執行 \u003ccode>uname -m\u003c/code>","用 \u003ccode>chmod\u003c/code> 修改 GPIO value"],"correct":0,"explanation":"USB SSH 只證明筆電能到 TX2，外網路由和 DNS 仍是獨立條件。getent 可查 TX2 自己能否解析 registry 名稱。若解析成功，再查 HTTP 連線等其他層次。","source":"複習筆記 · Lab 4 §6 連線與部署怎麼分層查？"},{"id":54,"topic":4,"prompt":"Lab 4 的 Express server 長時間運行，收到 HTTP 後呼叫固定的 GPIO 程式。和傳統 CGI 的對照何者合理？","options":["只要使用 HTML form 就一定是 CGI","Express 每次收到請求都必須重新啟動整個 Node server","CGI 只能處理 GPIO，Express 只能處理靜態圖片","兩者都能把 Web 請求接到後端處理，Express 可由常駐程序處理多次請求"],"correct":3,"explanation":"CGI 定義 Web server 與外部處理程式之間的介面，傳統部署常為每次請求啟動外部程式。Express 的 route 在常駐程序處理請求，需要時才呼叫獨立 GPIO 程式。","source":"複習筆記 · Lab 4 §7 IoT 與 CGI 的概念題"},{"id":55,"topic":5,"prompt":"原實驗把讀取 MCP3008 和以門檻控制兩顆 LED 放在一起。下列哪種交付分工符合筆記整理的要求？","options":["ADC 與門檻控制各一支，防盜快照只用終端機指令","把 CSI 顯示與亮暗門檻寫成同一支，省略防盜狀態","讀 ADC、開關 LED、照相各寫一支，防盜整合不必交付","感測與門檻控制一支程式，防盜快照另一支，CSI 顯示可先用命令測試"],"correct":3,"explanation":"項目一與二要求整合，目的是看到讀值與 LED 門檻行為的關係。項目三是用命令做相機顯示測試，項目四另做防盜快照，包含異常觸發與復歸。","source":"複習筆記 · Lab 5 §1 原教材要求與兩支程式"},{"id":56,"topic":5,"prompt":"若從環境光一路追到 Python 收到的 ADC 值，哪個訊號鏈正確？","options":["光線 → GPIO 數位高低 → LDR 放大 → MCP3008 輸出類比","光線 → LDR 輸出數位碼 → MCP3008 驅動 LED → SPI 接地","光線 → LDR 電阻 → 分壓電壓 → ADC 取樣量化 → SPI 讀值","光線 → SPI 位元 → LDR 電阻 → ADC 產生分壓"],"correct":2,"explanation":"LDR 將光線變化反映為電阻變化，分壓電路才把它轉為可量測的電壓。MCP3008 量化電壓，TX2 透過 SPI 取得已轉換的數位碼。","source":"複習筆記 · Lab 5 §2 訊號鏈：光照不是直接進 GPIO"},{"id":57,"topic":5,"prompt":"MCP3008 的 DIN 和 DOUT 應分別連到 TX2 的哪兩個 SPI 訊號？","options":["DIN 接 MOSI，DOUT 接 MISO","DIN 接 MISO，DOUT 接 MOSI","DIN 接 CS，DOUT 接 SCLK","DIN 接 SCLK，DOUT 接 CS"],"correct":0,"explanation":"MOSI 是主機輸出、周邊輸入，因此接 MCP3008 的 DIN，送出通道等控制位元。MISO 是主機輸入，因此接 DOUT，接收 ADC 結果。","source":"複習筆記 · Lab 5 §4 SPI 訊號與 ADC 資料解碼"},{"id":58,"topic":5,"prompt":"確認使用 hardware SPI，系統只有 \u003ccode>/dev/spidev3.0\u003c/code> 對應實驗接線。Python 應如何開啟它？","options":["\u003ccode>spi.open(0, 3)\u003c/code>","\u003ccode>spi.open(3, 0)\u003c/code>","\u003ccode>spi.open(0, 0)\u003c/code>","\u003ccode>spi.open(23, 24)\u003c/code>"],"correct":1,"explanation":"\u003ccode>/dev/spidevB.C\u003c/code> 中 B 是 bus，C 是 device／片選索引。實體腳位 23、24 是接頭位置，不能當成這兩個參數。題目已確認對應裝置，因此用 3、0。","source":"複習筆記 · Lab 5 §3 GPIO bit-banging 與 spidev 分開學"},{"id":59,"topic":5,"prompt":"兩位同學分別用 Jetson.GPIO bit-banging 和 \u003ccode>spidev\u003c/code> 讀 ADC，差異在哪？","options":["bit-banging 由 controller 產生時序，spidev 由 Python 逐 bit 改腳位","兩者都需要同一個 \u003ccode>/dev/spidevB.C\u003c/code> 才會切換 GPIO","兩者都用 J21 實體腳位當 spidev 的 bus number","bit-banging 自行切換 GPIO 時序，spidev 交由 SPI controller 傳輸"],"correct":3,"explanation":"bit-banging 程式自己控制 CS、CLK、MOSI 並讀 MISO。spidev 由核心 SPI 介面與控制器處理交易，需要相符的 pinmux 和裝置節點。","source":"複習筆記 · Lab 5 §3 GPIO bit-banging 與 spidev 分開學"},{"id":60,"topic":5,"prompt":"MCP3008 用 SPI 傳回一筆結果，傳到第二個 byte 中途就解除 CS。這最可能造成什麼？","options":["只影響下一筆交易的速度，當前位元一定正確","只要 CLK 繼續跳動，晶片就一定把同一筆資料送完","只會改變 ADC 的 10-bit 解析度為 8-bit","晶片把交易提早結束，收到的 bytes 無法當作完整轉換碼"],"correct":3,"explanation":"MCP3008 的 CS 為低有效，整筆 SPI 交易要維持選取。若中途解除，後續 clock 便不再屬於原本的交易，無法假設三個接收 byte 仍可照原公式拼接。","source":"複習筆記 · Lab 5 §4 SPI 訊號與 ADC 資料解碼"},{"id":61,"topic":5,"prompt":"依課堂送法 \u003ccode>[1, (8 + channel) &lt;&lt; 4, 0]\u003c/code>，讀取單端 CH5 應送出什麼？","options":["\u003ccode>[0x01, 0x85, 0x00]\u003c/code>","\u003ccode>[0x01, 0xD0, 0x00]\u003c/code>","\u003ccode>[0x01, 0x50, 0x00]\u003c/code>","\u003ccode>[0x01, 0xC0, 0x00]\u003c/code>"],"correct":1,"explanation":"\u003ccode>8 + 5 = 13\u003c/code>，十六進位為 D，左移 4 位得到 D0。第二個 byte 的高位組同時包含 single-ended 選擇和通道位元，不能只把通道數字附加在最低位。","source":"複習筆記 · Lab 5 §4 SPI 訊號與 ADC 資料解碼"},{"id":62,"topic":5,"prompt":"收到 \u003ccode>rx = [0x00, 0xA2, 0x40]\u003c/code>。以 \u003ccode>((rx[1] &amp; 3) &lt;&lt; 8) | rx[2]\u003c/code> 解碼，ADC 是多少？","options":["64","640","41536","576"],"correct":3,"explanation":"\u003ccode>0xA2 &amp; 3\u003c/code> 得到 2，左移 8 位等於 512。末 byte 0x40 是 64，合併後為 576。若直接拼入整個 0xA2，結果會超過 10-bit 範圍。","source":"複習筆記 · Lab 5 §4 SPI 訊號與 ADC 資料解碼"},{"id":63,"topic":5,"prompt":"10-bit ADC 的 VREF 為 3.3 V。理想 LSB 和最大輸出碼分別是什麼？","options":["約 3.30 mV，1024","約 0.806 mV，4095","約 3.22 mV，1023","約 12.9 mV，255"],"correct":2,"explanation":"10-bit 共有 2¹⁰ = 1024 個量化碼，從 0 開始，所以最大碼為 1023。理想 LSB 以參考電壓除以量化碼數，3.3 ÷ 1024 約為 0.00322 V。","source":"複習筆記 · Lab 5 §5 ADC 換算：1024 與 1023 的角色"},{"id":64,"topic":5,"prompt":"按講義理想換算 \u003ccode>V ≈ code × VREF / 1024\u003c/code>，VREF=3.3 V、code=512 約對應多少伏特？","options":["1.65 V","0.825 V","2.475 V","3.3 V"],"correct":0,"explanation":"512 恰好是 1024 的一半，理想換算結果是參考電壓的一半，也就是 1.65 V。實機的誤差還取決於參考電壓、雜訊和 ADC 本身。","source":"複習筆記 · Lab 5 §5 ADC 換算：1024 與 1023 的角色"},{"id":65,"topic":5,"prompt":"接法是 3.3 V → 10 kΩ 固定電阻 → VOUT → LDR → GND。LDR 為 100 kΩ，10-bit ADC 的 VREF 為 3.3 V。VOUT 和 ADC 估算值是多少？","options":["約 3.00 V，931","約 1.65 V，512","約 3.30 V，1023","約 0.30 V，93"],"correct":0,"explanation":"ADC 量的是下方 LDR 上的電壓，因此 VOUT = 3.3 × 100 ÷ (10 + 100) = 3.00 V。再乘上 1024 ÷ 3.3，得到約 931。0.30 V 是同條件下上方固定電阻的壓降。","source":"複習筆記 · Lab 5 §6 LDR 放哪邊，決定讀值方向"},{"id":66,"topic":5,"prompt":"把 LDR 改接在分壓器上方、固定電阻接地。其他條件相同，光線變強時 VOUT 如何變化？","options":["VOUT 先上升再下降，因為 SPI 改變方向","VOUT 下降，ADC 碼通常變小","VOUT 上升，ADC 碼通常變大","VOUT 一定維持 VREF 的一半"],"correct":2,"explanation":"光線變強時 LDR 電阻下降。此時下方是固定電阻，VOUT = VCC × Rfixed ÷ (RLDR + Rfixed)，分母減小，輸出上升。交換分壓器位置會反轉原本的趨勢。","source":"複習筆記 · Lab 5 §6 LDR 放哪邊，決定讀值方向"},{"id":67,"topic":5,"prompt":"教學例規定 ADC ≥600 開燈、≤450 關燈、中間保留狀態。原本熄燈，連續讀到 620、520、460、430，最後一個仍亮的讀值是哪個？","options":["460","430","520","620"],"correct":0,"explanation":"620 首先跨越開燈門檻。520 和 460 都位於兩門檻中間，延續亮燈狀態。430 低於關燈門檻才熄滅，這就是用遲滯降低頻繁切換。","source":"複習筆記 · Lab 5 §6 LDR 放哪邊，決定讀值方向"},{"id":68,"topic":5,"prompt":"正常狀態下門檻 T=200，ADC 依序是 720、710、450。何時觸發，基準 b 應記多少？","options":["讀到 710 時觸發，b=720","讀到 450 時觸發，b=710","不觸發，因為變化方向是下降","讀到 450 時觸發，b=450"],"correct":1,"explanation":"正常狀態比較相鄰值的絕對差。720 到 710 只差 10，710 到 450 差 260，已超門檻。觸發時保存變化之前的讀值 710，用來判斷後續是否復歸。","source":"複習筆記 · Lab 5 §7 防盜快照：觸發與復歸用不同參照值"},{"id":69,"topic":5,"prompt":"警報已觸發，基準 b=250、T=120。ADC 之後讀到 780、775、360，應在哪一筆復歸？","options":["775","360","三筆都不復歸","780"],"correct":1,"explanation":"警報中應比較每筆和固定基準 250 的差，分別為 530、525、110。只有 110 小於門檻，因此在 360 復歸。780 和 775 之間變化很小，仍然遠離原環境。","source":"複習筆記 · Lab 5 §7 防盜快照：觸發與復歸用不同參照值"},{"id":70,"topic":5,"prompt":"T=150，採本筆記「等於門檻時保留目前狀態」的設計。從正常起，依序讀 200、350、530、500、499，何時復歸？","options":["350","500","499","530"],"correct":2,"explanation":"200 到 350 差 150，仍正常。350 到 530 差 180，觸發並保存 b=350。500 距基準正好 150，維持警報。499 距基準 149，才回到正常。","source":"複習筆記 · Lab 5 §7 防盜快照：觸發與復歸用不同參照值"},{"id":71,"topic":5,"prompt":"異常後已連拍三張，當前值仍大幅偏離觸發前基準。依 Lab 5 後段要求應採取哪個行為？","options":["維持警報，依追拍策略取樣與拍照，直到回到原基準附近","拍完第三張就復歸，再用同一批照片決定燈是否交替","把基準改成當前值，立刻讓差值為零","只要連續兩筆差值小就復歸，即使仍遠離原基準"],"correct":0,"explanation":"連拍三張是觸發後第一批處理。接下來的狀態取決於 ADC 是否回到基準附近。若更新基準為異常值，持續異常便會被錯誤判為已復歸。","source":"複習筆記 · Lab 5 §7 防盜快照：觸發與復歸用不同參照值"},{"id":72,"topic":5,"prompt":"T=100，正常時連續讀到 100、170、240、310、380。依相鄰差值規則會發生什麼？","options":["讀到 310 時觸發，因為累計上升 210","不觸發，因為每次差值都是 70","讀到 240 時觸發，因為距第一筆 140","讀到 380 時觸發，因為目前 ADC 大於門檻"],"correct":1,"explanation":"正常狀態的判斷式使用相鄰讀值，每一次差都是 70，低於 100。雖然總變化達 280，這項實驗規則偵測的是瞬間變化，無法靠同一條判斷式偵測這段慢速漂移。","source":"複習筆記 · Lab 5 §7 防盜快照：觸發與復歸用不同參照值"},{"id":73,"topic":5,"prompt":"CSI 相機的 GStreamer 管線已能用 \u003ccode>xvimagesink\u003c/code> 顯示，現在想讓 OpenCV 取得每張 frame。應如何調整？","options":["將終點換成適當格式的 \u003ccode>appsink\u003c/code>，以 GStreamer 後端讀取","移除 sink，直接從 caps 取出已處理的影像","把 \u003ccode>nvarguscamerasrc\u003c/code> 換成 \u003ccode>appsink\u003c/code> 放在起點","保留 \u003ccode>xvimagesink\u003c/code>，從顯示器直接取得 Python ndarray"],"correct":0,"explanation":"xvimagesink 將資料交給畫面顯示。appsink 將 frame 交給應用程式，可搭配相容的 BGR 格式與 OpenCV 的 GStreamer 後端。仍要檢查相機是否開啟和每次 read 的結果。","source":"複習筆記 · Lab 5 §8 CSI 相機與 GStreamer"},{"id":74,"topic":5,"prompt":"移除 LDR 分壓後，確認電壓範圍安全，把 CH0 分別接 GND 和 3.3 V，成功讀到近零與近滿刻度。接回 LDR 卻讀值幾乎固定，下一步先查什麼？","options":["先更換 SPI bus，即使端點測試已對應正確讀值","量測分壓點並檢查 VOUT 到 CH0、LDR 和麵包板電源軌","只改警報門檻，因為 ADC 輸入已確定有變化","先替換 MCP3008，因為所有固定值都代表 ADC 故障"],"correct":1,"explanation":"兩端點測試顯示 ADC 和 SPI 鏈可在此條件下區分輸入。接回分壓後才出現問題，先確認 VOUT 是否隨光照改變、是否真的接到 CH0，以及電源軌與共地是否連通。","source":"複習筆記 · Lab 5 §9 ADC 一直為 0，怎麼縮小問題？"},{"id":75,"topic":6,"prompt":"依 Lab 6 的驗收分工，簡易模組和字元裝置驅動各在哪裡做？","options":["兩種任務都在 VM 編譯成功就完成全部要求","簡易模組只在 VM，字元裝置必須只在 TX2","兩種任務都只需在 TX2 做一次","簡易模組在 VM 與 TX2 各驗證，字元裝置在 VM 驗證"],"correct":3,"explanation":"簡易模組要在 VM 和 TX2 分別有編譯、載入、卸載及核心訊息的證據。字元裝置項目則在 VM 以使用者程式和裝置節點測試。環境不同，驗證結果要分開記錄。","source":"複習筆記 · Lab 6 §1 原要求：兩個環境、兩種任務"},{"id":76,"topic":6,"prompt":"以 sudo 執行一個程式開啟 \u003ccode>/dev/demo\u003c/code>。哪項描述最正確？","options":["sudo 使程式的所有 C 指令直接在 kernel mode 執行","只要是 root，就能直接呼叫任意 driver callback 地址","程式仍在 user space，以 system call 進入核心執行驅動操作","driver callback 會被搬到 user space 執行，直到程式關閉"],"correct":2,"explanation":"sudo 改變的是程序權限。應用程式透過 open 等 system call 請求核心服務，核心再依裝置號與 file_operations 呼叫對應驅動入口。","source":"複習筆記 · Lab 6 §2 User space、kernel space 與裝置分類"},{"id":77,"topic":6,"prompt":"最小模組想在載入時留下訊息、卸載時清理資源。正確的入口設計為何？","options":["用 \u003ccode>module_init\u003c/code>、\u003ccode>module_exit\u003c/code> 指定函式，以 \u003ccode>pr_info\u003c/code> 記錄","用 \u003ccode>mknod\u003c/code> 直接呼叫模組的初始化與清理函式","用 \u003ccode>.open\u003c/code> 初始化，close 任一 fd 時自動移除模組","用 \u003ccode>main()\u003c/code> 進入，按 Ctrl+C 後由 \u003ccode>printf\u003c/code> 卸載"],"correct":0,"explanation":"kernel module 由核心載入，入口與一般 user-space 可執行檔不同。載入時執行 init，卸載時執行 exit。pr_info／printk 進入核心日誌，可用 dmesg 觀察。","source":"複習筆記 · Lab 6 §3 簡易 module 的生命週期"},{"id":78,"topic":6,"prompt":"Kbuild 規則 \u003ccode>make -C &quot;$KDIR&quot; M=&quot;$PWD&quot; modules\u003c/code> 中，\u003ccode>-C\u003c/code> 和 \u003ccode>M\u003c/code> 的用途各是什麼？","options":["設定交叉編譯架構，設定 major number","設定目標執行檔路徑，指定 module 初始化函式","進入核心建置目錄，指定外部模組所在目錄","進入外部模組目錄，指定核心原始碼下載位置"],"correct":2,"explanation":"\u003ccode>-C\u003c/code> 指向相容的 kernel build tree，先讓 make 進入其建置環境。\u003ccode>M\u003c/code> 傳入外部模組目錄的絕對路徑，使 Kbuild 找到該模組的規則與原始碼。","source":"複習筆記 · Lab 6 §4 Kbuild 與 kernel 必須匹配"},{"id":79,"topic":6,"prompt":"\u003ccode>obj-m += hellod.o\u003c/code> 對外部模組建置代表什麼？","options":["要求 gcc 產生可用 \u003ccode>./hellod.o\u003c/code> 啟動的應用程式","要求系統一開機就載入 hellod 模組","要求核心自動註冊 \u003ccode>/dev/hellod\u003c/code>","要求 Kbuild 建出名為 hellod 的可載入模組"],"correct":3,"explanation":"\u003ccode>obj-m\u003c/code> 指定要編譯的模組，正常建置會產生 \u003ccode>hellod.ko\u003c/code>。是否建立裝置、註冊設備號或自動載入，都需要相應程式或系統設定。","source":"複習筆記 · Lab 6 §4 Kbuild 與 kernel 必須匹配"},{"id":80,"topic":6,"prompt":"VM 和 TX2 都顯示 aarch64。能否據此判定 VM 的 \u003ccode>hellod.ko\u003c/code> 可以直接在 TX2 載入？","options":["可以，只要兩邊都有相同的使用者帳號","可以，只要兩邊的 \u003ccode>uname -m\u003c/code> 一樣","不能單憑架構判定，還要查目標核心版本、設定及符號版本","可以，只要檔名同為 \u003ccode>hellod.ko\u003c/code>"],"correct":2,"explanation":"核心模組要和載入它的核心相容。相同架構只解決指令集的一部分條件，kernel release、建置設定及模組所需的符號版本也要核對。","source":"複習筆記 · Lab 6 §4 Kbuild 與 kernel 必須匹配"},{"id":81,"topic":6,"prompt":"已用 Kbuild 產生 \u003ccode>hellod.ko\u003c/code>。哪組動作最能證明這次的載入和卸載都有完成？","options":["只執行 make 並截圖生成的 \u003ccode>.ko\u003c/code>","insmod 後查 lsmod 和新的 dmesg，再 rmmod 並查卸載紀錄","先看 dmesg 的舊初始化紀錄，再刪除本機 \u003ccode>.ko\u003c/code>","只用 file 確認架構，省略 insmod"],"correct":1,"explanation":"檔案存在只能證明建置產出。驗證需確認模組真的加入執行中的核心，且卸載後有對應結果。新日誌與 lsmod 可交叉確認，避免將過去一次測試誤算為本次成功。","source":"複習筆記 · Lab 6 §5 操作與證據順序"},{"id":82,"topic":6,"prompt":"對 \u003ccode>hellod.ko\u003c/code> 執行 insmod 顯示 \u003ccode>File exists\u003c/code>。優先用哪個方法確認原因？","options":["用 \u003ccode>lsmod\u003c/code> 查是否已載入同名模組","用 \u003ccode>mknod\u003c/code> 建立同名裝置，再載入一次","用 \u003ccode>rm hellod.ko\u003c/code> 移除產物，再試同一條 insmod","把 \u003ccode>.ko\u003c/code> 改副檔名為 \u003ccode>.o\u003c/code>"],"correct":0,"explanation":"此錯誤常表示同名模組已在核心中。先用 lsmod 確認，再按需求處理引用和卸載。磁碟上的 \u003ccode>.ko\u003c/code> 存在原本就是 insmod 讀取檔案的必要條件。","source":"複習筆記 · Lab 6 §9 常見錯誤"},{"id":83,"topic":6,"prompt":"\u003ccode>insmod\u003c/code> 回報 \u003ccode>Invalid module format\u003c/code>，要釐清是否為 kernel 版本不符，最合適的資料組合是什麼？","options":["\u003ccode>lsmod\u003c/code> 的使用者清單及 GPIO export 編號","目前目錄的 \u003ccode>pwd\u003c/code>、模組的 Unix 擁有者","裝置節點的檔名與瀏覽器的 HTTP port","\u003ccode>modinfo\u003c/code> 的 vermagic、目標 \u003ccode>uname -r\u003c/code>、\u003ccode>file\u003c/code> 及新 dmesg"],"correct":3,"explanation":"modinfo 能顯示模組的 vermagic，uname -r 告知執行中核心的 release。再查看二進位架構和核心日誌，有助定位到底是版本、架構、配置還是其他載入條件不符。","source":"複習筆記 · Lab 6 §9 常見錯誤"},{"id":84,"topic":6,"prompt":"\u003ccode>mknod /dev/demo c 60 0\u003c/code> 中，\u003ccode>c\u003c/code>、60、0 分別代表什麼？","options":["字元裝置、major 60、minor 0","區塊裝置、minor 60、major 0","核心模組、版本 60、修訂 0","字元裝置、檔案權限 60、參數 0"],"correct":0,"explanation":"\u003ccode>c\u003c/code> 建立 character device 類型。裝置號為 major 60、minor 0，供核心定位註冊的裝置。它們與版本及 Unix 權限是不同欄位。","source":"複習筆記 · Lab 6 §6 /dev/demo、major/minor 與 register_chrdev"},{"id":85,"topic":6,"prompt":"\u003ccode>/dev/demo\u003c/code> 已存在，類型為字元裝置，號碼為 60:0，驅動卻只註冊 major 61。開啟失敗時應如何修正？","options":["讓節點設備號與該驅動實際註冊的號碼一致","只提高檔案權限，繼續使用 major 60","將節點由字元裝置改成普通檔案","將 \u003ccode>/dev/demo\u003c/code> 改名成與 \u003ccode>.ko\u003c/code> 完全相同"],"correct":0,"explanation":"核心靠設備號找到對應的驅動，檔名主要給使用者辨識。即使節點名稱看起來正確，major 不匹配也無法指向這個驅動。還應確認所用 minor 是該驅動支援的號碼。","source":"複習筆記 · Lab 6 §6 /dev/demo、major/minor 與 register_chrdev"},{"id":86,"topic":6,"prompt":"同一個驅動想區分兩個實例，兩個節點都使用同一 major。在合理的註冊設定下，要用哪項區分實例？","options":["使用不同 minor，驅動依次設備號選對應狀態","兩個 minor 必須都為零，改以不同檔名區分即可","改用不同 kernel release 區分","以 lsmod 裡的模組引用數代表實例號"],"correct":0,"explanation":"major 可把一組設備交給同一驅動，minor 則能讓驅動區分實例。建立不同路徑但使用相同設備號，仍會指到同一設備號所對應的介面。","source":"複習筆記 · Lab 6 §6 /dev/demo、major/minor 與 register_chrdev"},{"id":87,"topic":6,"prompt":"已開啟 \u003ccode>/dev/demo\u003c/code>，使用者程式呼叫 \u003ccode>ioctl(fd, cmd, arg)\u003c/code>，驅動有註冊對應的現代 handler。主要入口是哪個？","options":["\u003ccode>module_exit\u003c/code>","\u003ccode>.release\u003c/code>","\u003ccode>.unlocked_ioctl\u003c/code>","\u003ccode>.write\u003c/code>"],"correct":2,"explanation":"ioctl 傳送的是裝置特定控制命令，核心依 file_operations 找到相應 handler。普通資料寫入走 write，釋放開啟實例走 release，卸載模組才走 module exit。","source":"複習筆記 · Lab 6 §7 使用者操作如何進到 callback？"},{"id":88,"topic":6,"prompt":"程序持有指向同一開啟實例的兩個檔案描述符。關掉其中一個時，哪個敘述正確？","options":["兩個 fd 必須各觸發一次同一開啟實例的 release","每次 close 都一定執行 module_exit","最後一個開啟實例的引用釋放時才執行對應的 release，模組有獨立生命週期","第一次 close 就必須卸載模組並刪除節點"],"correct":2,"explanation":"描述符可共享同一開啟檔案。關閉其中一個只減少引用，最後釋放該實例才做 release。模組是否可卸載另外取決於整體引用與卸載操作。","source":"複習筆記 · Lab 6 §7 使用者操作如何進到 callback？"},{"id":89,"topic":6,"prompt":"驅動的 \u003ccode>.write\u003c/code> 收到 user buffer，\u003ccode>.read\u003c/code> 要把資料交還給 user buffer。兩者的複製方向何者正確？","options":["兩者都可直接把 user pointer 當 kernel pointer 解參考","兩者都用 \u003ccode>copy_to_user\u003c/code>","write 用 \u003ccode>copy_from_user\u003c/code>，read 用 \u003ccode>copy_to_user\u003c/code>","write 用 \u003ccode>copy_to_user\u003c/code>，read 用 \u003ccode>copy_from_user\u003c/code>"],"correct":2,"explanation":"API 名稱以核心為視角。write 將使用者資料複製進核心，read 將核心資料複製到使用者。複製前還應限制長度並處理失敗。","source":"複習筆記 · Lab 6 §8 User buffer 與 kernel buffer"},{"id":90,"topic":6,"prompt":"驅動可供 \u003ccode>cat /dev/demo\u003c/code> 讀取固定的一段資料。到達資料末端後，read callback 應回傳什麼？","options":["0，表示 EOF","-1，一律把正常結束當作讀取錯誤","最初的資料總長度，讓 cat 知道已讀完","資料最後一個 byte 的數值"],"correct":0,"explanation":"read 成功時回傳實際交付的 byte 數。固定資料已送完後回傳 0，讓使用者程式知道 EOF。若每次仍回正數而未處理 offset 或結束狀態，cat 可能一直讀。","source":"複習筆記 · Lab 6 §8 User buffer 與 kernel buffer"},{"id":91,"topic":6,"prompt":"驅動成功接收並處理了 12 bytes 的 write 要求，應回傳哪個值表示本次完整寫入？","options":["1","-12","12","0"],"correct":2,"explanation":"write 的正回傳值是已消耗的 byte 數。完整處理 12 bytes 時回傳 12。回傳 0 表示沒有寫入進度，負值用於錯誤碼，不能拿來表示完整成功。","source":"複習筆記 · Lab 6 §8 User buffer 與 kernel buffer"},{"id":92,"topic":6,"prompt":"\u003ccode>rmmod demo\u003c/code> 顯示模組仍在使用中。哪個操作次序最符合診斷流程？","options":["先刪除 \u003ccode>/dev/demo\u003c/code> 節點，已開啟的 fd 就一定會關閉","確認仍開啟的裝置或相依模組，正常結束引用後再卸載","先刪除 \u003ccode>demo.ko\u003c/code> 檔案，就能移除核心中仍使用的模組","用 mknod 改 major，原模組會被自動卸載"],"correct":1,"explanation":"模組仍被引用時，正常卸載會被拒絕。應檢查開啟的檔案或相依模組，先結束其使用。刪除磁碟上的模組或節點都不會自動釋放現有引用。","source":"複習筆記 · Lab 6 §9 常見錯誤"},{"id":93,"topic":7,"prompt":"下列哪一項正確描述 ISA 與微架構的關係？","options":["ISA 定義軟體可見的指令和行為，微架構決定處理器如何實現它","相同 ISA 的處理器必須有完全相同的功耗與速度","ISA 等同處理器的實體管線，微架構等同可執行檔格式","只要標為 RISC，便可推知任何工作負載下都較快"],"correct":0,"explanation":"軟體看到的是 ISA 提供的行為契約。不同處理器可用不同管線、快取與執行資源實現同一 ISA。要比較效能與功耗，還要看實作與工作負載。","source":"複習筆記 · Linux 與嵌入式系統 §2 ARM、RISC／CISC 與記憶體架構"},{"id":94,"topic":7,"prompt":"在教學模型中，Harvard 與 Von Neumann 架構的主要區別是什麼？","options":["Harvard 共用指令與資料通道，Von Neumann 一律分開","Harvard 只能跑 RISC，Von Neumann 只能跑 CISC","Harvard 分開指令與資料記憶體或通道，Von Neumann 共用","Harvard 沒有資料記憶體，Von Neumann 沒有指令記憶體"],"correct":2,"explanation":"Harvard 以分離路徑允許指令和資料各自存取。Von Neumann 模型讓兩者共享記憶體或通道，可能產生資源競爭。這個分類描述記憶體組織。","source":"複習筆記 · Linux 與嵌入式系統 §2 ARM、RISC／CISC 與記憶體架構"},{"id":95,"topic":7,"prompt":"\u003ccode>chmod 750 app\u003c/code> 對 owner、group、other 分別設定什麼權限？","options":["\u003ccode>rwx\u003c/code>、\u003ccode>r-x\u003c/code>、\u003ccode>---\u003c/code>","\u003ccode>r-x\u003c/code>、\u003ccode>rwx\u003c/code>、\u003ccode>---\u003c/code>","\u003ccode>rwx\u003c/code>、\u003ccode>r-x\u003c/code>、\u003ccode>r--\u003c/code>","\u003ccode>rwx\u003c/code>、\u003ccode>rw-\u003c/code>、\u003ccode>---\u003c/code>"],"correct":0,"explanation":"每位數都是 r=4、w=2、x=1 的和。7=4+2+1，5=4+1，0 不給任何權限。三位依序對應 owner、group、other。","source":"複習筆記 · Linux 與嵌入式系統 §5 權限、UID／GID 與檔案型態"},{"id":96,"topic":7,"prompt":"在課程的 Linux 路徑中，哪一組配對正確？","options":["\u003ccode>/root\u003c/code> 指整個檔案系統的根目錄，\u003ccode>/home\u003c/code> 存核心模組","\u003ccode>/dev/demo\u003c/code> 是模組原始碼，\u003ccode>/sys/class/gpio\u003c/code> 放套件下載檔","\u003ccode>/dev/demo\u003c/code> 是裝置節點，\u003ccode>/sys/class/gpio\u003c/code> 提供核心暴露的 GPIO 介面","\u003ccode>/proc\u003c/code> 放一般使用者家目錄，\u003ccode>/etc\u003c/code> 放 GPIO 裝置節點"],"correct":2,"explanation":"/dev 裝置節點可將檔案操作連到驅動。/sys 提供核心的裝置與系統屬性。/proc 提供程序與核心狀態，/root 則是 root 帳號的家目錄。","source":"複習筆記 · Linux 與嵌入式系統 §4 路徑與常見目錄"},{"id":97,"topic":7,"prompt":"I²C 的 START 條件和裝置選擇方式是什麼？","options":["SCL 為高時 SDA 由低轉高，接著拉低個別 CS","SCL 為高時 SDA 由高轉低，接著送裝置位址","SCL 由低轉高就表示 START，裝置靠 MOSI 方向選擇","SCL 為低時 SDA 由高轉低，以 UART baud rate 選裝置"],"correct":1,"explanation":"I²C 的 START 以 SCL 高時的 SDA 下降表示，接著通常會送 address 和讀寫位。相反的 SDA 上升是 STOP。CS 則屬於典型 SPI 的裝置選擇方式。","source":"複習筆記 · 通訊與感測器 §3 I²C 的時序怎麼看？"},{"id":98,"topic":7,"prompt":"SPI 設為 Mode 2，CPOL=1、CPHA=0。SCLK 閒置與取樣邊緣為何？","options":["閒置低，上升沿取樣","閒置高，下降沿取樣","閒置高，上升沿取樣","閒置低，下降沿取樣"],"correct":1,"explanation":"CPOL=1 令時脈閒置高，因此離開閒置的第一個邊緣是下降沿。CPHA=0 代表在第一個邊緣取樣。主機與周邊要對這個時序有相同設定。","source":"複習筆記 · 通訊與感測器 §4 SPI mode：先找閒置電位，再找取樣邊緣"},{"id":99,"topic":7,"prompt":"UART 採 19200 baud、8N1，假設每 symbol 一 bit 且連續傳送。理想每秒有多少資料 bytes？","options":["960 bytes/s","2400 bytes/s","19200 bytes/s","1920 bytes/s"],"correct":3,"explanation":"8N1 每個資料 byte 需要 1 start、8 data 和 1 stop，共 10 個 bit time。19200 ÷ 10 = 1920 bytes/s。2400 則漏算 start 和 stop 的成本。","source":"複習筆記 · 通訊與感測器 §5 UART 與 8N1 計算"},{"id":100,"topic":7,"prompt":"在課程相機架構中，設定曝光／增益與傳輸影像資料，通常分別走哪個介面？","options":["兩者都用 GPIO sysfs 的 value 傳輸","I²C 設定控制暫存器，MIPI CSI-2 傳輸影像","兩者都用 UART，以 baud rate 區分控制和影像","MIPI CSI-2 設定控制暫存器，I²C 傳輸原始影像"],"correct":1,"explanation":"I²C 常負責低頻寬的感測器控制，例如曝光與增益。CSI-2 負責高速影像資料。軟體處理圖像還需要 GStreamer 或其他應用層管線接收資料。","source":"複習筆記 · 通訊與感測器 §7 相機有兩條不同用途的通道"},
{"id":101,"topic":8,"prompt":"若兩顆處理器都支援同一套 ARM ISA，哪一項仍可能不同？","options":["快取大小、pipeline 與每條指令的執行成本","相同指令在 ISA 定義的操作數語意","相同指令在 ISA 定義的可見結果","已支援指令的編碼與格式"],"correct":0,"explanation":"ISA 規定程式能使用的指令與可見行為。CPU 的快取、分支預測與管線是實作選擇，所以相同 ISA 的處理器仍可能有不同效能。","source":"Lecture1.pdf · PDF 頁序 6–11"},
{"id":102,"topic":8,"prompt":"在典型的 load/store 指令集上，兩個值都在記憶體。要相加後存回記憶體，哪個順序符合這個設計？","options":["load 兩個值到暫存器，add 暫存器，store 結果","以 load 將加總寫回記憶體，再以 store 讀取來源","以 add 將兩個資料位址相加，再把位址當結果存回","先 store 兩個來源，再以 add 直接改兩個記憶體位址"],"correct":0,"explanation":"load/store 設計由專用指令在記憶體與暫存器間搬移資料。算術指令使用暫存器運算，再由 store 將結果寫回。","source":"Lecture1.pdf · PDF 頁序 10–12"},
{"id":103,"topic":8,"prompt":"若處理器可在同一個週期透過一條通道取指令、另一條通道讀資料，這符合哪種講義模型？","options":["分開指令與資料通道的 Harvard 架構","以 SSH 將指令和資料分別送往兩台主機","指令與資料共用單一通道的 Von Neumann 架構","以 UART 將指令和資料序列化的架構"],"correct":0,"explanation":"Harvard 模型區分指令和資料的存取路徑，可降低取指令與讀資料對同一通道的競爭。此題描述的是通道組織。","source":"Lecture1.pdf · PDF 頁序 12"},
{"id":104,"topic":8,"prompt":"一般程式呼叫 read 讀取檔案，哪項描述符合 Linux 執行模式？","options":["read 讓整個程式永久切換成 kernel mode","程式在 user mode 直接取代 kernel 的檔案系統","Shell 負責在 read 返回前實作底層設備驅動","程式提出系統呼叫，由核心執行對應的檔案操作再回傳"],"correct":3,"explanation":"系統呼叫是 user space 請求核心服務的介面。核心可以執行權限檢查及檔案操作，完成後回到呼叫端繼續執行。","source":"Lecture1.pdf · PDF 頁序 48–51"},
{"id":105,"topic":8,"prompt":"要檢查目前 PID 123 的程序狀態，哪個位置最接近講義介紹的 Linux 介面？","options":["/dev/123/status","/boot/123/status","/proc/123/status","/etc/123/status"],"correct":2,"explanation":"/proc 提供核心與程序的即時資訊，/proc/123 下包含該 PID 的狀態等資料。/etc 主要放系統設定，/dev 則提供裝置節點。","source":"Lecture1.pdf · PDF 頁序 44–47"},
{"id":106,"topic":8,"prompt":"目前資料夾有多層子目錄。執行這條命令時，什麼會被列出？","options":["只列目前目錄第一層中符合 *.c 的項目","掃描所有檔案內容，列出含有 .c 的文字行","列出任何名稱符合 *.c 的目錄，不包含一般檔案","目前目錄及其子目錄中，檔名符合 *.c 的一般檔案"],"correct":3,"explanation":"find 自指定起點往下搜尋。引號讓萬用字元交由 find 比對檔名，-type f 則限制結果為一般檔案。","source":"Lecture1.pdf · PDF 頁序 53–57","code":"find . -type f -name &#x27;*.c&#x27;"},
{"id":107,"topic":8,"prompt":"從 ls -l 看到這行，假設無額外 ACL。屬於 dev 群組但不是 owner 的使用者，對此檔案有什麼 mode 權限？","options":["可寫、可執行","可讀、可寫","可讀、可執行","可讀、可寫、可執行"],"correct":2,"explanation":"開頭的 - 表示一般檔案。接下來依序是 owner 的 rwx、group 的 r-x、other 的 ---，因此題目指定的群組成員只有讀和執行權限。","source":"Lecture1.pdf · PDF 頁序 60–61","code":"-rwxr-x--- 1 alice dev 1200 Nov 6 10:00 tool"},
{"id":108,"topic":8,"prompt":"查看帳號的 UID、主要 GID 與登入 shell，哪個檔案最直接？","options":["/etc/shadow","/etc/passwd","/etc/group","/proc/modules"],"correct":1,"explanation":"/etc/passwd 的帳號欄位含 UID、主要 GID、家目錄和登入 shell。/etc/group 用來查群組，/etc/shadow 主要保存密碼雜湊與期限資訊。","source":"Lecture1.pdf · PDF 頁序 64–69"},
{"id":109,"topic":8,"prompt":"檔案原先為 0640，執行下列命令後，低九個 mode bit 變為多少？","options":["0641","0740","0650","0660"],"correct":2,"explanation":"g 表示 group。原先群組數字 4 是 r--，加上執行的 1 得 5。owner 的 6 和 other 的 0 保留，結果為 0650。","source":"Lecture1.pdf · PDF 頁序 78–81","code":"chmod g+x demo"},
{"id":110,"topic":8,"prompt":"假設有權修改且不考慮特殊 mode bit，下列命令最後對應哪個八進位權限？","options":["0750","0714","0741","0761"],"correct":2,"explanation":"u=rwx 代表 7，g=r 代表 4，o=x 代表 1。等號將該類的權限設定成指定組合，所以結果為 0741。","source":"Lecture1.pdf · PDF 頁序 78–81","code":"chmod u=rwx,g=r,o=x demo"},
{"id":111,"topic":8,"prompt":"以下兩條命令都成功後，原本的 shell 目前目錄為何？","options":["仍為 /tmp","變成 /","取決於 whoami 的輸出","變成子程序的 home"],"correct":0,"explanation":"bash move.sh 在另一個 shell 程序執行，腳本中的 cd 只改該程序的工作目錄。腳本結束後，外層 shell 的工作目錄仍為 /tmp。","source":"Lecture1.pdf · PDF 頁序 84–86","code":"# move.sh 內容只有：cd /\ncd /tmp\nbash /path/to/move.sh\npwd"},
{"id":112,"topic":8,"prompt":"要檢查前處理展開後的內容，下列命令會產生什麼？","options":["供 linker 動態載入的共享函式庫","具有除錯資訊的可執行檔","前處理後的 C 原始文字","已組譯的 ELF 目的檔"],"correct":2,"explanation":"-E 讓 GCC 完成前處理後停止。輸出包含巨集展開、include 展開等結果，檔案副檔名 .i 也對應已前處理的 C 程式。","source":"Lecture1.pdf · PDF 頁序 99–102","code":"gcc -E program.c -o program.i"},
{"id":113,"topic":8,"prompt":"編譯器找不到 #include 引用的自訂標頭，但 linker 尚未執行。哪個選項最直接？","options":["-I 指定標頭搜尋目錄","-g 產生除錯資訊","-O2 提高最佳化等級","-L 指定函式庫搜尋目錄"],"correct":0,"explanation":"-I 加入前處理器搜尋標頭的目錄。-L 在連結階段提供函式庫搜尋目錄，無法解決編譯階段找不到 .h 的問題。","source":"Lecture1.pdf · PDF 頁序 102–103"},
{"id":114,"topic":8,"prompt":"講義範例以 MyProgram 為第一個目標。假設產物都存在，只有 main_def.h 比相依的 main.o 新，哪個重建順序合理？","options":["刪除 MyProgram，等下次 make 才編譯","重編 main.o，再連結 MyProgram","只連結 MyProgram，兩個 .o 都不重建","重編 function.o，再連結 MyProgram"],"correct":1,"explanation":"main_def.h 是 main.o 的前置條件，更新會使 main.o 過期。新 main.o 又使 MyProgram 過期。function.o 的依賴未改動，可直接重用。","source":"Lecture1.pdf · PDF 頁序 105–107","code":"MyProgram: main.o function.o\nmain.o: main.c main_def.h\nfunction.o: function.c function_def.h"},
{"id":115,"topic":8,"prompt":"將下列 pattern rule 用於 build/math.o 時，recipe 的 $&lt; 展開為何？","options":["math.o","src/math.c","build/math.o","src/%.c"],"correct":1,"explanation":"模式中的 stem 為 math，因此前置條件 src/%.c 展開成 src/math.c。$&lt; 取第一個前置條件，$@ 才是 build/math.o。","source":"Lecture1.pdf · PDF 頁序 109–111","code":"build/%.o: src/%.c\n\t$(CC) -c $&lt; -o $@"},
{"id":116,"topic":8,"prompt":"假設有正確 recipe，且未另外設定 .DEFAULT_GOAL，執行不帶目標的 make 會從哪裡開始？","options":["Program.o，因為字母順序優先","all，再依相依關係建置 Program","clean，因為它排在檔案結尾","FILE，因為它是第一個變數"],"correct":1,"explanation":"一般情況下，第一個有效 target 成為預設目標。FILE 是變數指派，接下來的 all 才是目標。make 會先處理 all 所依賴的 Program。","source":"Lecture1.pdf · PDF 頁序 106、113","code":"FILE = Program\nall: $(FILE)\n$(FILE): Program.o programA.o\nclean:"},
{"id":117,"topic":8,"prompt":"講義 Program.c 呼叫 programA、programB、programC，連結時漏了 programC.o，且沒有其他函式庫定義 programC。預期哪一步失敗？","options":["前處理階段找不到全部的程式函式名稱","連結階段找不到 programC 的定義","SSH 驗證階段拒絕登入","程式會成功連結，但自動跳過 programC()"],"correct":1,"explanation":"def.h 的宣告可以讓編譯器先產生呼叫。連結器仍需從目的檔或函式庫找到 programC 的定義，因此漏連時會出現未解析符號。","source":"Lecture1.pdf · PDF 頁序 112–114","code":"gcc -o Program Program.o programA.o programB.o"},
{"id":118,"topic":8,"prompt":"哪一項正確區分 ssh 與 sftp 的日常用途？","options":["ssh 和 sftp 都必須在 TX2 本機操作，不能由開發機執行","sftp 和 Telnet 一樣會以明文傳送帳號密碼","ssh 可開遠端 shell，sftp 提供透過 SSH 傳輸和管理遠端檔案","ssh 專用於上傳檔案，sftp 專用於登入遠端 shell"],"correct":2,"explanation":"ssh 常用於遠端終端機操作，sftp 提供列檔、下載和上傳等操作。兩者都可從開發機連到 TX2。","source":"Lecture1.pdf · PDF 頁序 124–131"},
{"id":119,"topic":9,"prompt":"GPIO 設成 input 後，應從哪類狀態讀取外部裝置的高低電位？","options":["對應 GPIO 的輸入資料值","目前使用者的裝置權限","方向控制位元本身","GPIO 的系統編號"],"correct":0,"explanation":"方向設定決定線路作輸入或輸出。輸入電位要從資料狀態讀取，方向位只表示用途，無法代表目前外部電位。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 7–10"},
{"id":120,"topic":9,"prompt":"同一個 SoC 腳位可作 GPIO 或 SPI 時脈。要使用硬體 SPI，應優先核對哪個設定？","options":["腳位複用是否切到 SPI 功能","應用程式是不是輸出 ELF 格式","把 sysfs value 固定為 1","程式有沒有把 GPIO 編號放入 argc"],"correct":0,"explanation":"腳位複用決定同一實體腳位接到哪個周邊控制器。切到 SPI 時，控制器負責產生時脈。GPIO 模式下的輸出設定無法替代硬體 SPI 的複用設定。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 10–12"},
{"id":121,"topic":9,"prompt":"TX2 J21 上一個腳位標為 GND。能否把它用作 C++ 程式控制的第四顆 LED 輸出？","options":["切換 J21 編號方向後，GND 就會成為輸出","將方向設為 out 後，GND 會由系統改為 3.3 V","在 sysfs export 寫該 GND 的 physical pin 即可","應改用可配置的 GPIO 腳位，GND 用作共地"],"correct":3,"explanation":"J21 接頭同時含電源、接地、GPIO 和其他功能。GND 是電路參考地。可配置腳位需依教材的 physical pin 與 sysfs 對照表選擇。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 17–22"},
{"id":122,"topic":9,"prompt":"假設 gpio255 已成功 export 並連接到外部開關，要讀開關邏輯值，哪組操作符合課堂 sysfs 模式？","options":["向 value 寫 in，然後讀 direction","先把 direction 設為 out，再讀 export","先把 direction 設為 in，再讀 value","對 unexport 寫 255，再讀 value"],"correct":2,"explanation":"在輸入模式下，value 是對應線路的邏輯讀值。export 用來請求建立介面，unexport 則撤銷介面。direction 和 value 有各自的用途。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 24–31"},
{"id":123,"topic":9,"prompt":"講義的 gpio_export(255) 先開啟 export，接著格式化 255 並寫入。若 snprintf 沒有截斷，實際寫出哪些 bytes？","options":["整數 255 的 4-byte 二進位表示","四個 bytes 2、5、5、NUL","三個字元 2、5、5，不含結尾 NUL","單一 byte 0xFF"],"correct":2,"explanation":"snprintf 以十進位格式把 255 轉為文字，回傳字元數 3，結尾 NUL 不計入回傳長度。write 依 len 寫 3 bytes。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 25、33","code":"len = snprintf(buf, sizeof buf, &quot;%u&quot;, 255u);\nwrite(fd, buf, len);"},
{"id":124,"topic":9,"prompt":"以下 snprintf 的緩衝區只有 3 bytes。正常格式化時，回傳值與 buf 的文字內容各是什麼？","options":["回傳 3，buf 存 255 且沒有結尾 NUL","回傳 2，buf 存 255 與結尾 NUL","回傳 -1，buf 保持未初始化","回傳 3，buf 存 25 與結尾 NUL"],"correct":3,"explanation":"snprintf 回傳有足夠空間時本來會產生的字元數。容量 3 要保留一個 NUL，所以實際只存 25。若拿 3 當成完整數字字串使用，會忽略截斷。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 33、44","code":"char buf[3];\nint len = snprintf(buf, sizeof buf, &quot;%u&quot;, 255u);"},
{"id":125,"topic":9,"prompt":"在講義的 sysfs 寫入流程中，open 回傳 0 時，以下檢查應採哪個條件來辨識開檔失敗？","options":["fd != 1","fd &lt;= 0","fd &lt; 0","fd == 0"],"correct":2,"explanation":"open 成功時回傳非負的檔案描述符。若標準輸入已關閉，0 可以是合法的 fd。失敗時回傳 -1，講義用 fd &lt; 0 檢查。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 33–36"},
{"id":126,"topic":9,"prompt":"依講義 gpio_set_dir 的 if/else，傳入 dirStatus 為 &quot;OUT&quot; 大寫時，程式會走哪一支？","options":["寫入字串 OUT","直接 return，不開啟 direction","走 if，寫入 out","走 else，寫入 in"],"correct":3,"explanation":"C++ 字串比較區分大小寫。範例只在 dirStatus 等於小寫 out 時寫 out，其餘走 else。正式程式應另外驗證輸入，避免錯字意外設為輸入。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 35","code":"if (dirStatus == &quot;out&quot;) write(fd, &quot;out&quot;, 4);\nelse write(fd, &quot;in&quot;, 3);"},
{"id":127,"topic":9,"prompt":"假設 GPIO 已設為輸出且操作成功，照講義分支，呼叫 gpio_set_value(255, -2) 會送哪個邏輯值？","options":["1","不會寫入任何值","0","-2"],"correct":0,"explanation":"講義以是否等於 0 分支，-2 為非零，會走 else 送出文字 1。若介面只接受 0 和 1，應在呼叫前限制參數值。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 36","code":"if (value == 0) write(fd, &quot;0&quot;, 2);\nelse write(fd, &quot;1&quot;, 2);"},
{"id":128,"topic":9,"prompt":"依講義設定 value 的方式，gpio=389 時，這行組出的 sysfs 路徑為何？","options":["/sys/class/gpio/gpio389/value","/sys/class/gpio/gpio389/direction","/sys/class/gpio/value/389","/sys/class/gpio/389/gpio/value"],"correct":0,"explanation":"格式字串 gpio%u 把 sysfs 編號嵌在 gpio 與 /value 中間。direction 檔案有不同用途，設定輸出值時要開啟 value。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 35–36","code":"snprintf(buf, sizeof buf, &quot;/sys/class/gpio/gpio%u/value&quot;, 389u);"},
{"id":129,"topic":9,"prompt":"C++ 先 open export、write、close(fd)。之後仍想操作 gpio255/value，哪項描述正確？","options":["close 會立刻撤銷對 gpio255 的 export","write 成功後 fd 自動改指向 gpio255/value","要維持 export，必須永遠保持 export 的 fd 開啟","close 只關閉這次的 fd，GPIO 介面仍可用，直到 unexport 等狀態變更"],"correct":3,"explanation":"講義把 export 與 unexport 實作為不同檔案操作。關閉 export 的描述符釋放開檔資源，並不會寫入 unexport。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 33–34"},
{"id":130,"topic":9,"prompt":"講義的範例 main 宣告 argc 與 argv，實際用 std::cin &gt;&gt; input 決定操作。執行 ./gpio_main 1 但不輸入標準輸入時，它會怎樣？","options":["argv[0] 會被當作標準輸入第一筆資料","argc 會因 std::cin 等待而減為 1","仍需從標準輸入讀取，命令列的 1 不會自動進入 input","自動令 input 等於 argv[1] 的數值 1"],"correct":2,"explanation":"argv 保存命令列參數，std::cin 讀取標準輸入，這是兩種來源。範例沒有把 argv[1] 轉給 input，因此在互動終端仍需鍵入值。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 38–39","code":"int input;\nstd::cin &gt;&gt; input;\nif (input == 1) gpio_export(255);"},
{"id":131,"topic":9,"prompt":"假設 gpio255 已 export 且為輸出。講義 main 讀到 2 時，兩個操作順序為何？","options":["先 unexport 255，再把 value 設為 0","只把 direction 設為 in，保留 export","先把 value 設為 0，再 unexport 255","先 export 255，再把 value 設為 1"],"correct":2,"explanation":"主程式的第二分支先關閉輸出，再移除 sysfs 介面。若先 unexport，後續要寫的 gpio255/value 路徑可能已不存在。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 34、36、38","code":"else if (input == 2) {\n    gpio_set_value(255, 0);\n    gpio_unexport(255);\n}"},
{"id":132,"topic":9,"prompt":"程式可以啟動，卻在 open gpio255/value 時得到 EACCES。問題最直接位於哪一層？","options":["一般執行檔缺少 x bit，尚未進入 main","程式身分對 GPIO sysfs 節點的存取權限","目標 ELF 指令集完全不相容","std::cin 把 argv[0] 清空"],"correct":1,"explanation":"程式已執行到 open，表示啟動階段已通過。EACCES 表示該檔案存取被拒，應查執行身分與節點權限。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 36、42–43"},
{"id":133,"topic":9,"prompt":"範例已檢查 open，但沒有檢查 write，最後一律 return 0。若 GPIO 寫入遭核心拒絕，呼叫端可能發生什麼？","options":["Linux 會把 return 0 改成該次 write 的 errno","誤以為操作成功，因為 write 的失敗未被傳回","open 的回傳值會自動改為 -1","close 一定能完整重試剛才的 write"],"correct":1,"explanation":"open 成功只表示取得描述符。write 本身仍可能失敗，應檢查負回傳值或短寫入並傳回錯誤。之後仍需關閉已開啟的 fd。","source":"Lecture2_GPIO2026.pdf · PDF 頁序 33–36","code":"write(fd, buf, len);\nclose(fd);\nreturn 0;"},
{"id":134,"topic":10,"prompt":"Qt Creator 的角色與 Qt 函式庫的角色如何配對？","options":["Creator 是開發環境，Qt 函式庫提供 GUI 與應用功能","Creator 提供執行時 GUI，Qt 函式庫只負責文字編輯","Creator 與 Qt 函式庫都只負責產生 Makefile","Creator 是核心模組，Qt 函式庫是 SSH 伺服器"],"correct":0,"explanation":"Qt Creator 提供編輯、設計、設定 kit 與建置介面。應用程式透過 Qt 函式庫使用 QWidget、訊號與槽等功能。","source":"Lecture3.pdf · PDF 頁序 6–9、24"},
{"id":135,"topic":10,"prompt":"依 Qt 物件繼承與物件樹的觀念，哪個說法正確？","options":["QObject 繼承 QMainWindow","所有 QObject 都是可直接顯示的 QWidget","QWidget 必須由 QMainWindow 物件本身繼承才會顯示","QWidget 繼承 QObject，QObject 也可用於非視覺物件"],"correct":3,"explanation":"QObject 提供物件樹和訊號槽等通用基礎。QWidget 在其上提供視窗或控制項功能，非視覺的 QObject 可以沒有畫面。","source":"Lecture3.pdf · PDF 頁序 10、15–17"},
{"id":136,"topic":10,"prompt":"要在 QMainWindow 的中央區域放兩欄、三列的六個按鈕，哪種配置最直接？","options":["在 central widget 上使用 QGridLayout","將六個按鈕設定為同一個 QLabel 的文字","只建立六個獨立 QMainWindow","把六個按鈕逐一加進同一個 QHBoxLayout"],"correct":0,"explanation":"QGridLayout 可按 row、column 位置放置元件。central widget 是 QMainWindow 用來放主要內容的區域，適合承載該 layout。","source":"Lecture3.pdf · PDF 頁序 12–14"},
{"id":137,"topic":10,"prompt":"以下 label 由 parent 管理，沒有另外改 parent。delete parent 後，label 指標所指物件的狀態為何？","options":["label 指標變數會由 Qt 自動設成 nullptr","子物件還在，直到刪除 QApplication 才銷毀","子物件繼續存在，會自動變成頂層視窗","子物件也已銷毀，該指標不可再使用"],"correct":3,"explanation":"在 QObject 物件樹中，銷毀 parent 會銷毀其 children。區域 raw pointer 不會因此自動變成 nullptr，後續不可透過它存取。","source":"Lecture3.pdf · PDF 頁序 16–17","code":"auto *parent = new QWidget;\nauto *label = new QLabel(&quot;Ready&quot;, parent);\ndelete parent;"},
{"id":138,"topic":10,"prompt":"類別使用 Q_OBJECT。若建置流程漏了對此類別生成並連結 MOC 產物，哪類結果最合理？","options":["qmake 會把 C++ 自動改成 Python","連結階段可能找不到類別的 meta-object 相關符號","所有 QLabel 文字會變成 objectName","每次 clicked 會自動執行兩次"],"correct":1,"explanation":"MOC 產生 Qt meta-object 機制需要的 C++ 定義。若對含 Q_OBJECT 的類別漏建相應產物，可能在連結時出現未定義的 meta-object 或 vtable 相關符號。","source":"Lecture3.pdf · PDF 頁序 7、41"},
{"id":139,"topic":10,"prompt":"讀下面講義形式的連線，sender 與 receiver 分別是哪個物件？","options":["button 是 sender，app 是 receiver","button 與 app 都是 sender","app 是 sender，button 是 receiver","clicked 是 sender，quit 是 receiver"],"correct":0,"explanation":"connect 的第一個物件提供訊號，第三個物件接收。按鈕發出 clicked(bool) 時，app 的 quit() 會被呼叫。該 slot 可以忽略訊號附帶的 bool。","source":"Lecture3.pdf · PDF 頁序 18–21","code":"QObject::connect(button, SIGNAL(clicked(bool)),\n                 &amp;app, SLOT(quit()));"},
{"id":140,"topic":10,"prompt":"這段程式最後一行的作用是什麼？","options":["執行 qmake 重新生成 Makefile","立即觸發 button 的 clicked 訊號","進入 Qt 的事件迴圈，處理按鈕點擊等事件","將 button 轉成 QApplication 物件"],"correct":2,"explanation":"button-&gt;show() 顯示按鈕，app.exec() 啟動應用程式的事件迴圈，才能持續接收使用者輸入及視窗事件。quit() 會要求事件迴圈結束。","source":"Lecture3.pdf · PDF 頁序 21","code":"QApplication app(argc, argv);\nbutton-&gt;show();\nreturn app.exec();"},
{"id":141,"topic":10,"prompt":"對同一顆按鈕建立下列兩條連線，並假設接收者都還活著。按一次時哪個敘述正確？","options":["兩個 slot 都能收到 clicked 事件","只有最後 connect 的 slot 能收到","必須用兩個不同的 signal，否則只會顯示按鈕","Qt 會因 sender 重複而拒絕第二條連線"],"correct":0,"explanation":"一個 signal 可連至多個 slot，各連線獨立。此處建立兩條不同連線，clicked 會分別通知兩個接收端。","source":"Lecture3.pdf · PDF 頁序 18–21","code":"connect(button, &amp;QPushButton::clicked, panel, &amp;QWidget::show);\nconnect(button, &amp;QPushButton::clicked, hint, &amp;QWidget::hide);"},
{"id":142,"topic":10,"prompt":"Designer 按鈕的 objectName 為 MyButton1，畫面文字顯示 Touch Me!。依 Go to slot 的自動連線命名，clicked 對應哪個名稱？","options":["on_MyLabel_clicked","on_MyButton1_clicked","MyButton1::clicked_slot","on_TouchMe_clicked"],"correct":1,"explanation":"Designer 的自動連線使用 on_物件名稱_訊號名稱。MyButton1 是 objectName，Touch Me! 是畫面上的 text，改標題不會改動自動連線所用名稱。","source":"Lecture3.pdf · PDF 頁序 35–41"},
{"id":143,"topic":10,"prompt":"若把 Designer 的 objectName 改成 RunButton，原先只有 on_MyButton1_clicked()，且沒有明確 connect，可能發生什麼？","options":["按鈕可自動依舊顯示文字找到同名 slot","自動連線找不到舊名稱對應的按鈕，應更新 slot 名稱或加入明確 connect","MOC 會把所有同一個訊號的 slots 自動合併","Qt 會把每個 clicked 事件送給所有私有 slots"],"correct":1,"explanation":"自動連線需讓 objectName 和 on_..._clicked 的中間部分相符。改名後應使用 on_RunButton_clicked，或透過 connect 明確指定對應關係。","source":"Lecture3.pdf · PDF 頁序 37–41"},
{"id":144,"topic":10,"prompt":"講義 MainWindow 建構式中的 ui-&gt;setupUi(this) 有什麼作用？","options":["銷毀 UI 元件並釋放記憶體","依 UI 定義建立並配置這個視窗的元件","開始在目標板交叉編譯 Qt","啟動 QApplication 事件迴圈直到結束"],"correct":1,"explanation":"setupUi 是依 Designer 表單產生的設定函式，用於建立與配置元件，並處理對應的 UI 初始化。這一步完成後才能安全存取 ui 裡的控制項。","source":"Lecture3.pdf · PDF 頁序 41–42","code":"MainWindow::MainWindow(QWidget *parent)\n    : QMainWindow(parent), ui(new Ui::MainWindow)\n{\n    ui-&gt;setupUi(this);\n}"},
{"id":145,"topic":10,"prompt":"下列是講義切換文字的邏輯。起始文字是 Ready，連續點擊三次，最後顯示什麼？","options":["This is an apple","Hello Qt Creator!!","空字串","Ready"],"correct":1,"explanation":"第一次 Ready 不符合 if，進入 else 設為 Hello。第二次符合 if，設為 apple。第三次不符合 if，再設回 Hello。","source":"Lecture3.pdf · PDF 頁序 43–44","code":"if (ui-&gt;MyLabel-&gt;text() == &quot;Hello Qt Creator!!&quot;)\n    ui-&gt;MyLabel-&gt;setText(&quot;This is an apple&quot;);\nelse\n    ui-&gt;MyLabel-&gt;setText(&quot;Hello Qt Creator!!&quot;);"},
{"id":146,"topic":10,"prompt":"若要取得 QLabel 目前內容並用 Qt 字串型別儲存，哪一行符合講義寫法？","options":["QString text = ui-&gt;MyLabel-&gt;setText(&quot;Ready&quot;);","QString text = ui-&gt;MyLabel-&gt;objectName();","QString text = ui-&gt;MyLabel-&gt;text();","QString text = ui-&gt;MyLabel-&gt;show();"],"correct":2,"explanation":"text() 回傳標籤顯示的 QString。setText() 負責修改內容，objectName() 回傳元件識別名稱，show() 控制顯示。","source":"Lecture3.pdf · PDF 頁序 43–44"},
{"id":147,"topic":10,"prompt":"要修改按鈕點下去後的 C++ 行為，最合理的修改位置是哪裡？","options":["由 MOC 產生的暫存 C++ 檔","mainwindow.ui 的畫面幾何尺寸欄位","編譯後的 Qt 可執行檔內容","mainwindow.cpp 裡對應的 slot 實作"],"correct":3,"explanation":"Designer 的 .ui 管理元件與配置。事件發生後的程式邏輯應寫在來源檔中的 slot。生成檔可在重建時被覆寫。","source":"Lecture3.pdf · PDF 頁序 32–34、39–42"},
{"id":148,"topic":10,"prompt":"在 TX2 專案目錄執行 qmake 後，下一步 make 做了什麼？","options":["以 scp 把整個專案傳回 VM","自動更換 TX2 的架構以執行 x86 程式","依生成的建置規則編譯並連結程式","將 .pro 直接當成可執行檔啟動"],"correct":2,"explanation":"qmake 讀取 .pro 和工具鏈設定生成 Makefile。make 再依規則執行編譯、MOC 等建置步驟及連結，產出可執行檔。","source":"Lecture3.pdf · PDF 頁序 48–51"},
{"id":149,"topic":10,"prompt":"Qt 專案在 x86 Ubuntu VM 的 Desktop kit 建置成功。把產出的 executable 原樣傳到 ARM64 TX2，哪項判斷合理？","options":["Qt 的跨平台特性會讓 ARM64 自動執行所有 x86 binary","在 TX2 執行 qmake 會直接修改既有 executable 的 CPU 指令","應在 TX2 重建或選相容的交叉工具鏈，先確認產物的目標架構","只要也把 .ui 檔一起傳送，就能讓 x86 binary 在 TX2 執行"],"correct":2,"explanation":"Qt 支援以同一份來源建置到不同平台。現有產物仍由當時的工具鏈決定架構，須重新建出可供 TX2 使用的版本。","source":"Lecture3.pdf · PDF 頁序 29、45、48–51"},
{"id":150,"topic":11,"prompt":"智慧魚塭使用溫度探頭、無線網路及監控儀表板。這三者依序落在哪些 IoT 層？","options":["感知層、應用層、網路層","感知層、網路層、應用層","應用層、網路層、感知層","網路層、感知層、應用層"],"correct":1,"explanation":"探頭負責感知，無線網路搬運資料，儀表板提供監控用途。分層時看元件負責的工作。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 12–14"},
{"id":151,"topic":11,"prompt":"攝影機每秒產生大量畫面，只有辨識到事件時才需通知遠端。哪個做法最符合講義的 edge computing？","options":["將取樣、辨識與控制都放在資料中心，TX2 只轉發封包","將所有原始影像傳到遠端再過濾","在靠近攝影機的 TX2 先辨識，只傳事件與所需影像","增加每張畫面的解析度並全部遠端保存"],"correct":2,"explanation":"靠近資料來源處理可減少上傳流量，也可縮短某些回應的往返時間。遠端仍可接收必要的結果與紀錄。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 17、19–20"},
{"id":152,"topic":11,"prompt":"Web server 透過 CGI 交給外部程式處理資料，哪項描述合理？","options":["CGI 只能由 Perl 實作，因為它是一種程式語言","CGI 只定義瀏覽器如何繪製 HTML 表格","CGI 定義 server 與處理程式間的傳遞介面，可由多種語言實作","CGI 會讓遠端瀏覽器直接取得 TX2 核心權限"],"correct":2,"explanation":"CGI 關注 Web server 如何把請求資訊交給程式，以及如何接收輸出。處理程式可以使用該環境可執行的語言。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 21–24"},
{"id":153,"topic":11,"prompt":"第一次在新資料夾建立講義的 Node 專案，以下兩條命令的作用各是什麼？","options":["先下載所有既有依賴，再把程式編譯成 ARM 執行檔","產生專案描述 package.json，再安裝 Express 並記錄依賴","啟動 Express，再產生系統的 DNS 設定","產生 HTTP route，再啟動瀏覽器"],"correct":1,"explanation":"npm init 初始化專案描述。npm install express --save 安裝模組並將它納入依賴，方便其他環境安裝相同專案。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 29–36","code":"npm init\nnpm install express --save"},
{"id":154,"topic":11,"prompt":"講義 package.json 指定 main 為 index.js。當你執行 node other.js 時，Node 首先嘗試執行哪個檔案？","options":["node_modules/express/index.js","package.json","index.js","other.js"],"correct":3,"explanation":"node 後直接指定檔案時，該檔案就是入口。package.json 的 main 用於相應的模組／套件入口解析。要執行講義的 index.js，可直接傳入該檔名。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 34、44","code":"{ &quot;main&quot;: &quot;index.js&quot; }\n# shell 中執行\nnode other.js"},
{"id":155,"topic":11,"prompt":"TX2 可 ping 通 8.8.8.8，但下列命令沒有得到位址。依講義的排查流程，哪一層最值得先查？","options":["Express 的 GET route","主機名稱解析與 DNS 設定","npm 的 JavaScript 引擎","GPIO direction"],"correct":1,"explanation":"IP 可達性與名稱解析是兩個檢查。getent hosts 查系統能否把網域解析成位址。已可 ping IP 卻無解析結果，應先查 resolver。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 39–41","code":"getent hosts registry.npmjs.org"},
{"id":156,"topic":11,"prompt":"以下 CommonJS 程式位在 server/index.js。哪一個 require 指向相對於這支模組的本機檔案？","options":["require(&#x27;./config.json&#x27;)","require(&#x27;path&#x27;)","require(&#x27;child_process&#x27;)","require(&#x27;express&#x27;)"],"correct":0,"explanation":"以 ./ 開頭的模組名稱依呼叫它的模組位置解析。express 由套件搜尋機制查找，child_process 和 path 則是 Node.js 內建模組。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 42"},
{"id":157,"topic":11,"prompt":"若 process.env.PORT 未設定，且 8080 可使用，下列程式會嘗試監聽哪個 port？","options":["8080","443","由系統隨機指派","80"],"correct":0,"explanation":"未設定的環境變數讀到 undefined，對 || 而言是假值，因此 PORT 取 8080。app.listen 使用選定的 port 開始監聽。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 43","code":"const PORT = process.env.PORT || 8080;\napp.listen(PORT);"},
{"id":158,"topic":11,"prompt":"假設下列 route 是唯一 handler，收到 POST /index 時，這個 handler 是否會執行？","options":["會，因為 /index 是 HTML 保留字","會，因為 Express 只比對路徑","會，因為 res.send 會把 POST 改成 GET","不會，handler 配對的是 GET /index"],"correct":3,"explanation":"Express route 同時依 HTTP method 與路徑配對。app.get 只處理 GET 等適用情況，POST 需對應的 app.post 或其他能接該方法的 handler。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 43、47","code":"app.get(&#x27;/index&#x27;, (req, res) =&gt; res.send(&#x27;ok&#x27;));"},
{"id":159,"topic":11,"prompt":"已從專案根目錄啟動講義的 server，public 資料夾內有 index.html。使用下列 middleware 時，通常由哪個 URL 路徑直接讀取該檔？","options":["/public/index.html","/index?file=public/index.html","/node_modules/public/index.html","/index.html"],"correct":3,"explanation":"沒有設定掛載前綴時，靜態目錄本身對應網站路徑的根。public/index.html 是檔案系統路徑，瀏覽器以 /index.html 要求該內容。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 47–48","code":"app.use(express.static(&#x27;./public&#x27;));"},
{"id":160,"topic":11,"prompt":"在以下表單輸入小明後送出。後端要讀取該欄位，應使用哪個 query 鍵？","options":["req.query.姓名","req.query.name","req.query.student","req.query.index"],"correct":1,"explanation":"成功送出的表單控制項以 name 為鍵。id 供頁面識別元件，label 是顯示內容，action 則設定提交的路徑。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 46–47","code":"&lt;form action=&quot;/index&quot; method=&quot;get&quot;&gt;\n  &lt;label for=&quot;student&quot;&gt;姓名&lt;/label&gt;\n  &lt;input id=&quot;student&quot; name=&quot;name&quot;&gt;\n  &lt;button type=&quot;submit&quot;&gt;送出&lt;/button&gt;\n&lt;/form&gt;"},
{"id":161,"topic":11,"prompt":"單一 query 參數是 id=007。這個 Express 範例回應中的 my id 會是什麼？","options":["布林值 true","undefined","數字 7","字串 &quot;007&quot;"],"correct":3,"explanation":"URL query 中的純文字值通常以字串取得。這段程式直接使用 req.query.id，沒有用 Number 或 parseInt 做轉換，所以前導零仍保留。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 47","code":"app.get(&#x27;/index&#x27;, (req, res) =&gt; {\n  res.send({ &quot;my id&quot;: req.query.id });\n});"},
{"id":162,"topic":11,"prompt":"同一表單有下列兩個 radio。原本 A 選取，使用者再選 B 後送出，會傳哪一筆？","options":["b=mode","mode=a&amp;mode=b","mode=b","mode=Radio B"],"correct":2,"explanation":"同一表單內的同名 radio 屬於同一組，選 B 會取消 A。送出的參數用 name 作鍵，以所選 input 的 value 作值。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 52","code":"&lt;input type=&quot;radio&quot; name=&quot;mode&quot; value=&quot;a&quot; checked&gt;\n&lt;input type=&quot;radio&quot; name=&quot;mode&quot; value=&quot;b&quot;&gt;"},
{"id":163,"topic":11,"prompt":"講義的 checkbox 沒有 value，scales 勾選而 horns 未勾選。兩者在同一表單送出時，會有哪些參數？","options":["scales=true&amp;horns=false","兩個欄位都不送","scales=&amp;horns=on","只有 scales=on"],"correct":3,"explanation":"沒有 value 的已勾選 checkbox 使用預設值 on。未勾選的 checkbox 不會成為表單欄位，所以後端要自行處理缺值。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 53","code":"&lt;input type=&quot;checkbox&quot; name=&quot;scales&quot; checked&gt;\n&lt;input type=&quot;checkbox&quot; name=&quot;horns&quot;&gt;"},
{"id":164,"topic":11,"prompt":"下面的表單控制項會不會出現在請求裡？","options":["hidden 表示欄位永遠不會被送出","group 只會在瀏覽器畫面顯示，伺服器收不到","hidden 欄位經瀏覽器加密，後端無法檢查其值","隱藏欄位仍會送出 group=A，後端仍應驗證"],"correct":3,"explanation":"hidden 控制項的值不顯示在表單畫面，但有效的具名欄位仍可提交。使用者也能改動請求，後端不宜把它視為可信的權限證明。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 54–55","code":"&lt;input type=&quot;hidden&quot; name=&quot;group&quot; value=&quot;A&quot;&gt;"},
{"id":165,"topic":11,"prompt":"表單中的輸入欄初始 value 為 Ada。使用者改成 Lin 後按 reset，會發生什麼？","options":["欄位回到 Ada 並同步更新後端資料庫","欄位回到 Ada，這次按鈕不送出表單","欄位變空並向 action 送出 POST","欄位維持 Lin 並自動提交"],"correct":1,"explanation":"reset 將控制項恢復為初始值。它與 submit 的送出行為不同，因此題目中的值會復原成 Ada，瀏覽器不因這個按鈕發送表單。","source":"Lecture4_2026嵌入式系統在物聯網的應用_V3.pdf · PDF 頁序 54–55","code":"&lt;input name=&quot;name&quot; value=&quot;Ada&quot;&gt;\n&lt;input type=&quot;reset&quot; value=&quot;Clear&quot;&gt;"},
{"id":166,"topic":12,"prompt":"兩個介面各要傳 8 個資料 bit。平行介面有 8 條資料線，串列介面有 1 條。哪個比較合理？","options":["平行可在同一資料時刻送多 bit，總吞吐量仍要看時脈及其他限制","平行介面一定比任何串列介面快 8 倍","串列介面不會有訊號完整性問題","兩者在每個資料時刻都會使用 8 條獨立資料線"],"correct":0,"explanation":"平行和串列描述資料位元如何分佈在線路與時間上。實際吞吐還受到可用時脈、線長、串擾與協定開銷影響。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 4–5"},
{"id":167,"topic":12,"prompt":"I²C 的 SDA 使用 open-drain 加上拉電阻。所有裝置都釋放 SDA 時，正常電位應為何？","options":["隨機變動，因為上拉只提供時脈","由上拉電阻拉成 High","由 MOSI 的電位決定","維持 Low，直到裝置主動輸出 High"],"correct":1,"explanation":"open-drain 裝置能拉低或釋放線路。無裝置拉低時，上拉使線路回到 High。這也允許多個裝置共享 SDA。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 8–9"},
{"id":168,"topic":12,"prompt":"I²C 傳送一組 8-bit 資料後，第九個 SCL 週期的 SDA 由誰處理 ACK？","options":["傳送方拉高 SDA 代表 ACK","主機用片選 CS 代表 ACK","接收方拉低 SDA 代表 ACK","接收方將 SCL 拉高代表 NACK"],"correct":2,"explanation":"在第九個時脈，傳送方釋放 SDA，接收方可拉低回應 ACK。主機讀最後一組資料時可回 NACK 表示接收結束。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 9"},
{"id":169,"topic":12,"prompt":"在 SCL 維持 High 時，SDA 從 Low 變成 High。依講義時序，這代表什麼？","options":["STOP","START","ACK","資料位元的正常切換"],"correct":0,"explanation":"STOP 是 SCL 高時的 SDA 上升。START 則是同一時脈條件下的 SDA 下降。普通資料期間通常在 SCL 低時改變 SDA。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 9"},
{"id":170,"topic":12,"prompt":"要讓 SPI 時脈閒置為 High，並在第二個邊緣取樣，應設定哪個 mode？","options":["Mode 1，CPOL=0、CPHA=1","Mode 0，CPOL=0、CPHA=0","Mode 2，CPOL=1、CPHA=0","Mode 3，CPOL=1、CPHA=1"],"correct":3,"explanation":"CPOL=1 指閒置高，CPHA=1 選第二個邊緣。閒置高時，第一邊是下降、第二邊是上升，所以為 Mode 3 上升沿取樣。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 14–15"},
{"id":171,"topic":12,"prompt":"兩個一般 SPI 周邊共用 SCLK、MOSI 與 MISO。主機如何讓其中一個回應？","options":["送出 I²C 位址以選其中一個周邊","將兩個周邊的 MISO 改接不同的 GND","啟用目標的 CS，讓另一個周邊保持未選取","把兩個 CS 同時拉低，再以 UART baud rate 區分"],"correct":2,"explanation":"典型 SPI 用各自的 CS 選裝置。共用 MISO 時，未選取的周邊通常釋放該線路。若兩者同時驅動 MISO，資料可能衝突。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 13–17"},
{"id":172,"topic":12,"prompt":"兩台裝置採一般 UART 連線。只有兩端都把 TX 接到對方 TX，RX 接到對方 RX。要怎麼修正？","options":["將兩條資料線短接，再各自改成相反 baud rate","改接 CS0，並把兩端的 TX 接 GND","保持 TX→TX，另外接一條 SCLK","交叉接 TX→RX 與 RX←TX，確認共地和通訊參數"],"correct":3,"explanation":"UART 的 TX 是輸出，必須接另一端的 RX 輸入。沒有共用時脈線，因此 baud rate 和 frame 設定也需一致。","source":"Lecture5_Microprocessor-Systems_v3.pdf · PDF 頁序 19–20"},
