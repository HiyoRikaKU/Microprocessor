<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EDEDED">
  <meta name="description" content="四路 LED 遠端控制、交替閃爍與流水燈。">
  <title>Lab04 · LED Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="canvas" id="controls">
    <div class="workspace">
      <header class="heading"><h1>LED CONTROL</h1><span id="connection" role="status">連線中…</span></header>
      <form id="manual-form" aria-label="LED 設定">
        <div class="led-grid">
          <section class="led-card" data-led="0" aria-labelledby="led1-title"><h2 id="led1-title">LED1</h2><div class="indicator" role="img" aria-label="LED1 狀態未知"><span></span></div><button class="switch" type="button" role="switch" aria-checked="false" aria-label="LED1 設定" data-led-switch="0" data-command-ui disabled><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">OFF</span></button></section>
          <section class="led-card" data-led="1" aria-labelledby="led2-title"><h2 id="led2-title">LED2</h2><div class="indicator" role="img" aria-label="LED2 狀態未知"><span></span></div><button class="switch" type="button" role="switch" aria-checked="false" aria-label="LED2 設定" data-led-switch="1" data-command-ui disabled><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">OFF</span></button></section>
          <section class="led-card" data-led="2" aria-labelledby="led3-title"><h2 id="led3-title">LED3</h2><div class="indicator" role="img" aria-label="LED3 狀態未知"><span></span></div><button class="switch" type="button" role="switch" aria-checked="false" aria-label="LED3 設定" data-led-switch="2" data-command-ui disabled><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">OFF</span></button></section>
          <section class="led-card" data-led="3" aria-labelledby="led4-title"><h2 id="led4-title">LED4</h2><div class="indicator" role="img" aria-label="LED4 狀態未知"><span></span></div><button class="switch" type="button" role="switch" aria-checked="false" aria-label="LED4 設定" data-led-switch="3" data-command-ui disabled><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">OFF</span></button></section>
        </div>
      </form>
      <div class="mode-grid">
        <button class="submit-card" type="submit" form="manual-form" data-command-ui disabled>
          <svg class="submit-icon" width="160" height="130" viewBox="0 0 120 100" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M64 12h27a12 12 0 0 1 12 12v50a12 12 0 0 1-12 12H64"/><path d="M11 49h65M57 30l19 19-19 19"/></g><circle cx="11" cy="49" r="5" fill="#B3201F"/></svg>
          <span>Submit</span>
        </button>
        <section class="mode-card shine-card" aria-labelledby="shine-title">
          <div class="card-heading"><h2 id="shine-title">交替閃爍</h2><span class="group-hint">1 / 3 ⇄ 2 / 4</span></div>
          <form id="shine-form">
            <div class="count-row"><label for="count">次數</label><input id="count" name="count" type="number" min="1" max="100" step="1" value="5" required data-command-ui disabled><button class="pill primary" type="submit" data-command-ui disabled>Mode_Shine</button></div>
            <div class="slider-field"><input id="count-slider" type="range" min="1" max="100" step="1" value="5" aria-label="閃爍次數" data-command-ui disabled><div class="range-labels" aria-hidden="true"><span>1</span><span>100</span></div></div>
            <div class="progress-label"><span>完成</span><output id="progress">0 / 5</output></div><progress id="shine-meter" max="5" value="0" aria-label="交替閃爍完成進度"></progress>
          </form>
        </section>
        <section class="mode-card running-card" aria-labelledby="running-title">
          <h2 id="running-title">流水燈</h2>
          <div class="sequence" aria-label="流水燈順序：1 → 2 → 3 → 4"><span data-sequence="0">1</span><i aria-hidden="true">→</i><span data-sequence="1">2</span><i aria-hidden="true">→</i><span data-sequence="2">3</span><i aria-hidden="true">→</i><span data-sequence="3">4</span></div>
          <div class="running-actions"><button id="running-switch" class="switch" type="button" role="switch" aria-checked="false" aria-label="流水燈開關" title="Running Light on / Running Light off" data-command-ui disabled><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">OFF</span></button><button id="reverse" class="pill direction-button" type="button" data-command-ui disabled>Change Direction</button></div>
        </section>
      </div>
      <p id="feedback" class="feedback sr-only" role="status" aria-live="polite"></p>
    </div>
  </main>
</body>
</html>
